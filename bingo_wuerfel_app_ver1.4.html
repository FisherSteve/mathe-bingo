<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <title>Mathe-Bingo 1.4</title>

  <style>
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(99,102,241,0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(20,184,166,0.14), transparent 24%),
        linear-gradient(180deg, #f8fafc, #eef2ff 45%, #f8fafc);
    }
    .glass {
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: 0 16px 40px rgba(15,23,42,0.10);
      backdrop-filter: blur(10px);
    }
    .dice-face {
      background: linear-gradient(145deg, #ffffff, #eef2ff);
      border: 1px solid rgba(99,102,241,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 14px 30px rgba(79,70,229,0.16);
    }
    .bingo-cell { aspect-ratio: 1 / 1; }
    .bingo-preview {
      display: grid;
      gap: 0.4rem;
      padding: 0.4rem;
      border-radius: 1rem;
      background: #e2e8f0;
    }
    .root-expression {
      display: inline-flex;
      align-items: flex-start;
      line-height: 1;
    }
    .root-symbol {
      font-size: 1.16em;
      line-height: 0.95;
      margin-right: 0.02em;
    }
    .root-radicand {
      border-top: 0.08em solid currentColor;
      padding: 0.04em 0.08em 0;
      line-height: 0.96;
    }
    @keyframes dice-pop {
      0% { transform: scale(0.76) rotate(-5deg); opacity: 0.45; }
      62% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes result-flip {
      0% { transform: rotateY(80deg) scale(0.94); opacity: 0; }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    .animate-dice-pop { animation: dice-pop 0.34s cubic-bezier(.22,.68,0,1.35) both; }
    .animate-result-flip { animation: result-flip 0.28s ease-out both; perspective: 600px; }
    .fs-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(0.5rem, 2vh, 1.25rem);
      padding: clamp(0.65rem, 2vw, 1.5rem);
      overflow: hidden;
      color: white;
      background: linear-gradient(135deg, #3730a3 0%, #0f766e 100%);
    }
    .fs-topbar, .fs-bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      min-height: 0;
    }
    .fs-main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: clamp(0.75rem, 3vw, 2rem);
      align-items: center;
    }
    .fs-main-no-dice {
      grid-template-columns: minmax(0, 1fr);
    }
    .fs-main-no-dice .fs-task {
      width: min(100%, 96vw);
      max-width: none;
      justify-self: center;
    }
    .fs-dice-grid {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(0.35rem, 1.8vw, 1.25rem);
    }
    .fs-dice-face {
      aspect-ratio: 1 / 1;
      min-width: 0;
      width: min(100%, 28vh, 13rem);
      justify-self: center;
      border-radius: clamp(1rem, 2vw, 1.75rem);
      border: 2px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.14);
      box-shadow: 0 18px 45px rgba(15,23,42,0.22);
      backdrop-filter: blur(8px);
    }
    .fs-task {
      min-width: 0;
      border-radius: 1.25rem;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.10);
      padding: clamp(0.8rem, 2.5vw, 2rem);
      text-align: center;
      box-shadow: 0 16px 38px rgba(15,23,42,0.18);
    }
    .fs-task-text {
      font-size: clamp(2rem, 7vw, 7.5rem);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }
    .task-expression {
      display: inline-block;
      width: max-content;
      max-width: 100%;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
    }
    .task-expression-scroll {
      overflow-x: auto;
      scrollbar-width: none;
    }
    .task-expression-scroll::-webkit-scrollbar { height: 0; }
    .fs-main-no-dice .fs-task-text {
      overflow-x: auto;
      padding-inline: 0.25rem;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
      scrollbar-width: none;
    }
    .fs-main-no-dice .fs-task-text::-webkit-scrollbar { height: 0; }
    .fs-button {
      border: 2px solid rgba(16,185,129,0.55);
      background: rgba(16,185,129,0.92);
      box-shadow: 0 0 34px rgba(16,185,129,0.32);
    }
    .fs-pill {
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.11);
      backdrop-filter: blur(8px);
    }
    .fs-bingo-hint {
      max-width: min(48rem, 58vw);
      max-height: min(16rem, 28vh);
      overflow: auto;
      scrollbar-width: thin;
    }
    @media (max-width: 900px), (max-height: 620px) {
      .fs-overlay { display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; }
      .fs-topbar, .fs-main, .fs-bottombar { flex-shrink: 0; }
      .fs-main { grid-template-columns: 1fr; min-height: min-content; align-content: start; }
      .fs-dice-face { width: min(100%, 20vh, 9rem); }
      .fs-task { padding: 0.8rem; }
      .fs-task-text { font-size: clamp(1.7rem, 8vw, 4.4rem); }
      .fs-main-no-dice .fs-task { width: 100%; }
      .task-expression, .fs-main-no-dice .fs-task-text {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .fs-topbar, .fs-bottombar { flex-wrap: wrap; }
      .fs-bingo-hint {
        max-width: 100%;
        max-height: min(9rem, 26vh);
        font-size: 0.8rem;
      }
    }
    /* Let presentation graphs use the remaining viewport, keeping SVG proportions. */
    .fs-overlay-graph { display:grid; overflow:hidden; }
    .fs-overlay-graph .fs-main { min-height:0; align-items:stretch; align-content:stretch; flex-shrink:1; }
    .fs-overlay-graph .fs-task {
      display:flex; flex-direction:column; align-items:center;
      width:100%; height:100%; min-height:0;
      padding:clamp(0.4rem,1vh,0.8rem);
    }
    .fs-overlay-graph .fs-task > :not(.fs-task-text) { flex-shrink:0; }
    .fs-overlay-graph .fs-task-text {
      display:flex; align-items:center; justify-content:center;
      flex:1 1 0; align-self:stretch; width:100%; min-height:0;
      margin-top:0.35rem; padding:0; overflow:hidden;
    }
    .fs-overlay-graph .fs-task-text > svg { display:block; width:100%; height:100% !important; }
    /* S6a: task navigation; mathematical renderers and PDF layout are unchanged. */
    :focus-visible { outline: 3px solid #4338ca !important; outline-offset: 3px; }
    .fs-overlay :focus-visible { outline-color: #fde047 !important; }
    .s6-shell { background: #f5f7fb; }
    .s6-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; padding:1rem max(1rem,calc((100% - 1152px)/2)); border-bottom:1px solid #cbd5e1; background:white; }
    .s6-nav { border:1px solid #cbd5e1; border-radius:.75rem; padding:.7rem 1rem; color:#334155; font-weight:700; background:white; }
    .s6-nav-active { color:white; background:#4338ca; border-color:#4338ca; }
    .s6-title { margin:1.5rem 0; font-size:clamp(1.5rem,3vw,2rem); font-weight:850; color:#0f172a; }
    .s6-panel { border:1px solid #cbd5e1; border-radius:1rem; background:white; padding:1.25rem; }
    .s6-setbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; border-left:4px solid #4338ca; border-radius:.6rem; background:#eef2ff; padding:.9rem 1rem; }
    .s6-entry { display:flex; flex-direction:column; align-items:flex-start; gap:1rem; padding:1.5rem; border:1px solid #cbd5e1; background:white; border-radius:1rem; text-align:left; color:#334155; }
    .s6-entry b { font-size:1.15rem; color:#0f172a; }
    .s6-entry:hover { border-color:#4338ca; background:#eef2ff; }
    .s6-step { display:grid; place-items:center; width:2rem; height:2rem; border-radius:50%; background:#e0e7ff; color:#3730a3; font-weight:800; }
    .s6-primary,.s6-secondary { border-radius:.75rem; padding:.7rem 1rem; font-weight:750; border:1px solid #4338ca; }
    .s6-primary { background:#4338ca; color:white; }
    .s6-primary:hover { background:#3730a3; }
    .s6-secondary { background:white; color:#3730a3; }
    .s6-primary:disabled,.s6-secondary:disabled { background:#e2e8f0; color:#475569; border-color:#cbd5e1; cursor:not-allowed; }
    .s6-input { display:block; width:100%; min-width:0; border:1px solid #94a3b8; border-radius:.6rem; padding:.7rem; background:white; color:#0f172a; }
    .s6-disclosure { min-width:0; border:1px solid #cbd5e1; background:white; border-radius:.8rem; }
    .s6-disclosure > summary { cursor:pointer; padding:1rem; color:#334155; font-weight:750; }
    .s6-disclosure[open] > summary { border-bottom:1px solid #e2e8f0; }
    .s6-shell .text-slate-400 { color:#64748b; }
    .s6-shell .bg-gradient-to-br { background:linear-gradient(125deg,#3730a3,#0f766e); }
    .s6-shell button,.s6-shell summary { overflow-wrap:anywhere; }
    .s6-shell select { max-width:100%; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;
    const APP_VERSION = 'MB3';

    function xmur3(str) {
      let h = 1779033703 ^ String(str).length;
      for (let i = 0; i < String(str).length; i++) {
        h = Math.imul(h ^ String(str).charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;
      };
    }

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
        const t = (a + b) | 0;
        a = b ^ (b >>> 9);
        b = (c + (c << 3)) | 0;
        c = (c << 21) | (c >>> 11);
        d = (d + 1) | 0;
        const r = (t + d) | 0;
        c = (c + r) | 0;
        return (r >>> 0) / 4294967296;
      };
    }

    function createRng(seed) {
      const seedFn = xmur3(seed || '0');
      const rand = sfc32(seedFn(), seedFn(), seedFn(), seedFn());
      return {
        next: rand,
        int(min, max) { return Math.floor(rand() * (max - min + 1)) + min; },
        choice(list) { return list[this.int(0, list.length - 1)]; },
        shuffle(list) {
          const copy = [...list];
          for (let i = copy.length - 1; i > 0; i--) {
            const j = this.int(0, i);
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        }
      };
    }

    function makeSeed(prefix = '') {
      const n = Math.floor(Date.now() * 1000 + Math.random() * 1000);
      return `${prefix}${n.toString(36).toUpperCase()}`;
    }

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      return b === 0 ? a : gcd(b, a % b);
    }

    function clampNumber(value, min, max, fallback) {
      const n = Number.parseInt(value, 10);
      if (!Number.isFinite(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }

    function uniqBy(items, keyFn) {
      const seen = new Set();
      const out = [];
      for (const item of items) {
        const key = keyFn(item);
        if (!seen.has(key)) {
          seen.add(key);
          out.push(item);
        }
      }
      return out;
    }

    function estimateCombinations(n, k) {
      if (n < k) return 0;
      k = Math.min(k, n - k);
      let result = 1;
      for (let i = 1; i <= k; i++) {
        result = result * (n - k + i) / i;
        if (result > 999999) return 999999;
      }
      return Math.floor(result);
    }

    function formatApproxCardCombinations(value) {
      if (value >= 999999) return 'sehr viele';
      return String(value);
    }

    function formatFractionText(entry, mixed = false) {
      if (entry.den === 1) return String(entry.num);
      if (mixed && Math.abs(entry.num) > entry.den) {
        const sign = entry.num < 0 ? '-' : '';
        const absNum = Math.abs(entry.num);
        const whole = Math.floor(absNum / entry.den);
        const rest = absNum % entry.den;
        if (rest === 0) return `${sign}${whole}`;
        return `${sign}${whole} ${rest}/${entry.den}`;
      }
      return `${entry.num}/${entry.den}`;
    }

    function splitMixedFraction(num, den) {
      if (den === 1 || Math.abs(num) <= den) return { whole: 0, num, den };
      const sign = num < 0 ? -1 : 1;
      const absNum = Math.abs(num);
      return { whole: sign * Math.floor(absNum / den), num: absNum % den, den };
    }

    function formatSignedTerms(parts) {
      const cleaned = parts.filter(p => p.coef !== 0);
      if (!cleaned.length) return '0';
      return cleaned.map((p, index) => {
        const sign = p.coef < 0 ? '-' : '+';
        const abs = Math.abs(p.coef);
        const displayTerm = p.term ? p.term.replace(/\^2/g, '²').replace(/\^3/g, '³') : '';
        const body = p.term ? `${abs === 1 ? '' : abs}${displayTerm}` : String(abs);
        return index === 0 ? (sign === '-' ? `-${body}` : body) : ` ${sign} ${body}`;
      }).join('');
    }

    function formatVarTerm(coef, variable) {
      if (coef === 1) return variable;
      if (coef === -1) return `-${variable}`;
      return `${coef}${variable}`;
    }

    function polyKey(parts) {
      return parts.filter(p => p.coef !== 0).sort((a, b) => a.term.localeCompare(b.term)).map(p => `${p.term}:${p.coef}`).join('|') || '0';
    }

    function formatPoly(parts, order) {
      const map = new Map();
      parts.forEach(p => map.set(p.term, (map.get(p.term) || 0) + p.coef));
      const keys = order || Array.from(map.keys()).filter(Boolean).sort();
      const ordered = [...keys, ''].filter((key, idx, arr) => arr.indexOf(key) === idx && (map.get(key) || 0) !== 0);
      return formatSignedTerms(ordered.map(term => ({ term, coef: map.get(term) || 0 })));
    }

    function formatFactorPrefix(coef) {
      if (coef === 1) return '';
      if (coef === -1) return '-';
      return String(coef);
    }

    function formatVariableFactor(coef, variable) {
      if (coef === 1) return variable;
      if (coef === -1) return `-${variable}`;
      return `${coef}${variable}`;
    }

    function formatVertexFunction(a, b, c) {
      const vertical = c === 0 ? '' : ` ${c < 0 ? '-' : '+'} ${Math.abs(c)}`;
      if (b === 0) return `f(x) = ${formatFactorPrefix(a)}x²${vertical}`;
      const bracket = `x ${b < 0 ? '+' : '-'} ${Math.abs(b)}`;
      return `f(x) = ${formatFactorPrefix(a)}(${bracket})²${vertical}`;
    }

    function formatQuadraticZeros(x1, x2) {
      return x1 === x2 ? `x = ${x1}` : `x₁ = ${x1}, x₂ = ${x2}`;
    }

    const RANDOM_TERM_VARIABLE_SETS = [
      ['x', 'y'],
      ['a', 'b'],
      ['m', 'n'],
      ['p', 'q'],
      ['u', 'v']
    ];

    function getVariables(code, seedText = '') {
      if (String(code || '').startsWith('set:')) {
        const idx = clampNumber(String(code).slice(4), 0, RANDOM_TERM_VARIABLE_SETS.length - 1, 0);
        return RANDOM_TERM_VARIABLE_SETS[idx];
      }
      if (code === 'random') {
        const sets = RANDOM_TERM_VARIABLE_SETS;
        const idx = Math.abs(xmur3(String(seedText || 'terms'))()) % sets.length;
        return sets[idx];
      }
      if (code === 'ab') return ['a', 'b'];
      if (code === 'xy') return ['x', 'y'];
      return ['x'];
    }

    function addUniqueTask(tasks, seen, task) {
      if (!seen.has(task.id)) {
        seen.add(task.id);
        tasks.push(task);
      }
    }

    function buildMultiplicationTasks(params) {
      const tasks = [];
      for (let a = 1; a <= params.n; a++) {
        for (let b = 1; b <= params.n; b++) {
          const targetKey = String(a * b);
          tasks.push({ id: `mul:${a}x${b}`, a, b, targetKey, label: `${a} · ${b}` });
        }
      }
      return tasks;
    }

    function buildMultiplicationCards(params) {
      return uniqBy(buildMultiplicationTasks(params).map(t => ({
        id: `p-${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetKey
      })), e => e.targetKey).sort((a, b) => Number(a.targetKey) - Number(b.targetKey));
    }

    function primesUpTo(n) {
      const sieve = Array(n + 1).fill(true);
      sieve[0] = sieve[1] = false;
      for (let i = 2; i * i <= n; i++) if (sieve[i]) for (let j = i * i; j <= n; j += i) sieve[j] = false;
      return Array.from({ length: Math.max(0, n - 1) }, (_, i) => i + 2).filter(i => sieve[i]);
    }

    function buildPrimeTasks(params) {
      const ps = primesUpTo(params.n);
      const tasks = [];
      for (const a of ps) for (const b of ps) {
        const targetKey = String(a * b);
        tasks.push({ id: `prime:${a}x${b}`, a, b, targetKey, label: `${a} · ${b}` });
      }
      return tasks;
    }

    function buildPrimeCards(params) {
      return uniqBy(buildPrimeTasks(params).map(t => ({
        id: `pp-${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetKey
      })), e => e.targetKey).sort((a, b) => Number(a.targetKey) - Number(b.targetKey));
    }

    function includeFractionByShape(num, den, shape) {
      if (shape === 'proper') return Math.abs(num) < den;
      if (shape === 'improper') return Math.abs(num) > den;
      return true;
    }

    function fractionMultipliers(params) {
      const choices = [params.k1, params.k2, params.k3].map(v => Math.max(2, Number(v) || 2));
      if (params.scaleMode === 'product') return [choices[0] * choices[1] * choices[2]];
      if (params.scaleMode === 'random') return Array.from(new Set(choices));
      return [choices[0]];
    }

    function buildFractionTasks(params) {
      const tasks = [];
      const mode = params.fractionTaskType || 'reduce';
      const includeReduce = mode === 'reduce' || mode === 'mixed';
      const includeExpand = mode === 'expand' || mode === 'mixed';
      const bases = new Map();
      const numeratorMax = params.fractionShape === 'improper' ? params.n * 2 : params.n;
      const denominatorMax = params.fractionShape === 'proper' ? params.n * 2 : params.n;
      for (let a = 1; a <= numeratorMax; a++) {
        for (let b = 1; b <= denominatorMax; b++) {
          const g = gcd(a, b);
          const num = a / g;
          const den = b / g;
          if (!includeFractionByShape(num, den, params.fractionShape)) continue;
          const key = `${num}/${den}`;
          if (!bases.has(key)) bases.set(key, { num, den, targetKey: key });
          if (includeReduce) tasks.push({ id: `frac:reduce:${a}/${b}`, a, b, num, den, targetKey: key, targetLabel: formatFractionText({ num, den }, params.fractionMixedNumbers), label: `${a}/${b}`, subtype: 'reduce' });
        }
      }
      if (includeExpand) {
        const multipliers = fractionMultipliers(params);
        for (const base of bases.values()) {
          for (const k of multipliers) {
            const displayNum = base.num * k;
            const displayDen = base.den * k;
            tasks.push({
              id: `frac:expand:${base.targetKey}:${k}`,
              num: base.num,
              den: base.den,
              k,
              displayNum,
              displayDen,
              targetKey: `${displayNum}/${displayDen}`,
              targetLabel: `${displayNum}/${displayDen}`,
              label: `${base.num}/${base.den} erweitern mit ${k}`,
              subtype: 'expand'
            });
          }
        }
      }
      return tasks;
    }

    function buildFractionCards(params) {
      return uniqBy(buildFractionTasks(params).map(t => ({
        id: `f-${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.subtype === 'expand'
          ? `${t.displayNum}/${t.displayDen}`
          : formatFractionText({ num: t.num, den: t.den }, params.fractionMixedNumbers),
        kind: 'fraction',
        num: t.subtype === 'expand' ? t.displayNum : t.num,
        den: t.subtype === 'expand' ? t.displayDen : t.den,
        mixed: t.subtype === 'expand' ? false : Boolean(params.fractionMixedNumbers)
      })), e => e.targetKey).sort((a, b) => (a.num / a.den) - (b.num / b.den) || a.num - b.num || a.den - b.den);
    }

    function fractionDisplayTask(task, params, rng) {
      if (task.subtype === 'expand') return { ...task, mixed: false };
      const choices = [params.k1, params.k2, params.k3].map(v => Math.max(2, Number(v) || 2));
      let k = choices[0];
      if (params.scaleMode === 'random') k = rng.choice(choices);
      if (params.scaleMode === 'product') k = choices[0] * choices[1] * choices[2];
      // The question must retain the unreduced fraction, even for integer answers.
      return { ...task, displayNum: task.num * k, displayDen: task.den * k, mixed: false, label: `${task.num * k}/${task.den * k}`, k };
    }

    function balancedTermTasks(tasks, limit = 1600) {
      const groups = new Map();
      for (const task of uniqBy(tasks, t => t.id)) {
        if (!groups.has(task.subtype)) groups.set(task.subtype, []);
        groups.get(task.subtype).push(task);
      }
      const result = [];
      for (let i = 0; result.length < limit; i++) {
        let added = false;
        for (const group of groups.values()) {
          if (group[i] && result.length < limit) { result.push(group[i]); added = true; }
        }
        if (!added) break;
      }
      return result;
    }

    function buildTermTasks(params) {
      if (params.termVariables === 'random') {
        const grouped = RANDOM_TERM_VARIABLE_SETS.map((set, index) => buildTermTasks({ ...params, termVariables: `set:${index}` }));
        const mixed = [];
        const maxLength = Math.max(...grouped.map(group => group.length));
        for (let i = 0; i < maxLength; i += 1) {
          grouped.forEach(group => {
            if (group[i]) mixed.push(group[i]);
          });
        }
        return balancedTermTasks(mixed);
      }
      const vars = getVariables(params.termVariables, `${params.termTopic}|${params.termCoeffMax}|${params.termConstants}|${params.termPowers}`);
      const v = vars[0];
      const w = vars[1] || vars[0];
      const max = clampNumber(params.termCoeffMax, 2, 12, 5);
      const difficulty = clampNumber(params.termDifficulty, 1, 5, 3);
      const diffMax = Math.min(max, Math.max(4, difficulty + 3));
      const allowNegatives = Boolean(params.termNegatives) && difficulty >= 2;
      const useConstants = Boolean(params.termConstants);
      const usePowers = Boolean(params.termPowers) || (params.termTopic === 'powers');
      const coeffs = [];
      for (let i = allowNegatives ? -max : 1; i <= max; i++) if (i !== 0) coeffs.push(i);
      const constantLimit = Math.min(max, difficulty + 2);
      const constants = useConstants ? Array.from({ length: constantLimit * 2 + 1 }, (_, i) => i - constantLimit).filter(x => allowNegatives || x >= 0) : [0];
      const topic = params.termTopic || 'mixed';
      const allowed = topic === 'mixed'
        ? [
            'collect',
            difficulty >= 2 ? 'mix' : 'collect',
            usePowers ? 'powers' : 'collect',
            difficulty >= 2 ? 'distribute' : 'collect',
            difficulty >= 3 ? 'factor' : 'mix',
            difficulty >= 4 ? 'products' : 'distribute',
            difficulty >= 5 ? 'binomial' : 'factor'
          ]
        : [topic];
      const tasks = [];
      const seen = new Set();
      const add = (display, parts, subtype) => {
        const order = [`${v}^3`, `${v}^2`, `${w}^2`, `${v}${w}`, `${v}`, `${w}`];
        const target = formatPoly(parts, order);
        addUniqueTask(tasks, seen, {
          id: `term:${subtype}:${display}`,
          targetKey: polyKey(parts),
          label: display,
          targetLabel: target,
          subtype
        });
      };
      for (const subtype of allowed) {
        if (['collect', 'mix', 'powers'].includes(subtype)) {
          for (const a of coeffs) for (const b of coeffs) for (const c of constants.slice(0, 8)) {
            if (subtype === 'collect') {
              add(`${formatSignedTerms([{ coef: a, term: v }, { coef: b, term: v }, { coef: c, term: '' }])}`, [{ coef: a + b, term: v }, { coef: c, term: '' }], 'collect');
              if (difficulty >= 3) add(`${formatSignedTerms([{ coef: a, term: v }, { coef: b, term: v }, { coef: -Math.sign(a) * Math.min(Math.abs(a), Math.abs(b)), term: v }, { coef: c, term: '' }])}`, [{ coef: a + b - Math.sign(a) * Math.min(Math.abs(a), Math.abs(b)), term: v }, { coef: c, term: '' }], 'collect');
              if (difficulty >= 4) add(`${formatSignedTerms([{ coef: a, term: v }, { coef: b, term: v }, { coef: c, term: '' }, { coef: -b, term: v }, { coef: useConstants ? difficulty : 0, term: '' }])}`, [{ coef: a, term: v }, { coef: c + (useConstants ? difficulty : 0), term: '' }], 'collect');
            }
            if (subtype === 'mix') {
              const mixCoeffLimit = max;
              if (Math.abs(a) <= mixCoeffLimit && Math.abs(b) <= mixCoeffLimit) {
                if (vars.length === 1) {
                  add(`${formatSignedTerms([{ coef: a, term: v }, { coef: c, term: '' }, { coef: b, term: v }, { coef: useConstants ? difficulty : 0, term: '' }])}`, [{ coef: a + b, term: v }, { coef: c + (useConstants ? difficulty : 0), term: '' }], 'mix');
                  if (useConstants && difficulty >= 2) add(`${formatSignedTerms([{ coef: a, term: v }, { coef: b, term: '' }, { coef: c, term: '' }])}`, [{ coef: a, term: v }, { coef: b + c, term: '' }], 'mix');
                  if (useConstants && difficulty >= 3) add(`${formatSignedTerms([{ coef: a, term: v }, { coef: b, term: '' }, { coef: -a, term: v }, { coef: c, term: '' }])}`, [{ coef: b + c, term: '' }], 'mix');
                } else {
                  for (const firstVar of vars) {
                    const secondVar = vars.find(item => item !== firstVar) || firstVar;
                    add(`${formatSignedTerms([{ coef: a, term: firstVar }, { coef: b, term: secondVar }, { coef: a, term: firstVar }, { coef: c, term: '' }])}`, [{ coef: 2 * a, term: firstVar }, { coef: b, term: secondVar }, { coef: c, term: '' }], 'mix');
                    if (difficulty >= 3) add(`${formatSignedTerms([{ coef: a, term: firstVar }, { coef: b, term: secondVar }, { coef: -a, term: firstVar }, { coef: c, term: '' }])}`, [{ coef: b, term: secondVar }, { coef: c, term: '' }], 'mix');
                    if (difficulty >= 4) add(`${formatSignedTerms([{ coef: a, term: firstVar }, { coef: b, term: secondVar }, { coef: -b, term: secondVar }, { coef: c, term: '' }])}`, [{ coef: a, term: firstVar }, { coef: c, term: '' }], 'mix');
                  }
                }
              }
            }
            if (subtype === 'powers' && usePowers) {
              add(`${formatSignedTerms([{ coef: a, term: `${v}^2` }, { coef: b, term: `${v}^2` }, { coef: c, term: '' }])}`, [{ coef: a + b, term: `${v}^2` }, { coef: c, term: '' }], 'powers');
              if (difficulty >= 2) add(`${formatSignedTerms([{ coef: a, term: `${v}^2` }, { coef: b, term: v }, { coef: -Math.sign(a), term: `${v}^2` }, { coef: c, term: '' }])}`, [{ coef: a - Math.sign(a), term: `${v}^2` }, { coef: b, term: v }, { coef: c, term: '' }], 'powers');
            }
            if (tasks.length > 900) break;
          }
        }
        if (subtype === 'plusBrackets') {
          for (const a of coeffs) for (const b of coeffs.slice(0, 8)) for (const c of constants.slice(0, 8)) {
            const outside = difficulty >= 3 ? [{ coef: a, term: v }, { coef: c, term: '' }] : [{ coef: a, term: v }];
            const inside = difficulty >= 2 ? [{ coef: b, term: v }, { coef: -c, term: '' }] : [{ coef: b, term: v }];
            add(`${formatSignedTerms(outside)} + (${formatSignedTerms(inside)})`, [...outside, ...inside], 'plusBrackets');
          }
        }
        if (subtype === 'minusBrackets') {
          for (const a of coeffs) for (const b of coeffs.slice(0, 8)) for (const c of constants.slice(0, 8)) {
            const outside = difficulty >= 3 ? [{ coef: a, term: v }, { coef: c, term: '' }] : [{ coef: a, term: v }];
            const inside = difficulty >= 2 ? [{ coef: b, term: v }, { coef: c, term: '' }] : [{ coef: b, term: v }];
            const resultParts = [...outside, ...inside.map(p => ({ ...p, coef: -p.coef }))];
            if (polyKey(resultParts) !== '0') add(`${formatSignedTerms(outside)} - (${formatSignedTerms(inside)})`, resultParts, 'minusBrackets');
          }
        }
        if (['distribute', 'factor'].includes(subtype)) {
          const factors = coeffs.filter(a => a !== 1);
          const numericFactors = factors.filter(a => difficulty >= 2 || a > 0);
          const innerCoeffs = difficulty >= 3 ? coeffs.filter(a => Math.abs(a) <= Math.min(max, difficulty + 2)) : [1];
          const constantValues = [];
          for (let b = difficulty >= 4 && allowNegatives ? -diffMax : 1; b <= diffMax; b++) if (b !== 0) constantValues.push(b);
          for (const a of numericFactors) for (const innerCoef of innerCoeffs) for (const b of constantValues) {
            if (subtype === 'factor') {
              const displayParts = [{ coef: a * innerCoef, term: v }, { coef: a * b, term: '' }];
              const display = formatSignedTerms(displayParts);
              const inside = formatSignedTerms([{ coef: innerCoef, term: v }, { coef: b, term: '' }]);
              const target = `${formatFactorPrefix(a)}(${inside})`;
              addUniqueTask(tasks, seen, {
                id: `term:factor:${display}`,
                targetKey: `factor:${a}:${innerCoef}:${v}:${b}`,
                label: display,
                targetLabel: target,
                subtype: 'factor'
              });
            } else {
              const inside = formatSignedTerms([{ coef: innerCoef, term: v }, { coef: b, term: '' }]);
              add(`${formatFactorPrefix(a)}(${inside})`, [{ coef: a * innerCoef, term: v }, { coef: a * b, term: '' }], 'distribute');
            }
          }
          if (usePowers && difficulty >= 3) {
            const powerFactors = numericFactors.filter(a => Math.abs(a) <= Math.min(max, difficulty + 2));
            for (const a of powerFactors) for (let b = 1; b <= diffMax; b++) {
              if (subtype === 'distribute') {
                add(`${formatVariableFactor(a, v)}(${v} + ${b})`, [{ coef: a, term: `${v}^2` }, { coef: a * b, term: v }], 'distribute');
                if (difficulty >= 5) add(`${formatFactorPrefix(a)}(${formatSignedTerms([{ coef: 1, term: `${v}^2` }, { coef: 1, term: v }, { coef: b, term: '' }])})`, [{ coef: a, term: `${v}^2` }, { coef: a, term: v }, { coef: a * b, term: '' }], 'distribute');
              } else {
                const display = formatSignedTerms([{ coef: a, term: `${v}^2` }, { coef: a * b, term: v }]);
                const target = `${formatVariableFactor(a, v)}(${v} + ${b})`;
                addUniqueTask(tasks, seen, {
                  id: `term:factor-power:${display}`,
                  targetKey: `factorPower:${a}:${v}:${b}`,
                  label: display,
                  targetLabel: target,
                  subtype: 'factor'
                });
                if (difficulty >= 5) {
                  const displayPoly = formatSignedTerms([{ coef: a, term: `${v}^2` }, { coef: a, term: v }, { coef: a * b, term: '' }]);
                  const targetPoly = `${formatFactorPrefix(a)}(${formatSignedTerms([{ coef: 1, term: `${v}^2` }, { coef: 1, term: v }, { coef: b, term: '' }])})`;
                  addUniqueTask(tasks, seen, {
                    id: `term:factor-poly:${displayPoly}`,
                    targetKey: `factorPoly:${a}:${v}:${b}`,
                    label: displayPoly,
                    targetLabel: targetPoly,
                    subtype: 'factor'
                  });
                }
              }
            }
          }
        }
        if (subtype === 'products') {
          for (let a = 1; a <= diffMax; a++) for (let b = 1; b <= diffMax; b++) {
            add(`(${v} + ${a})(${v} + ${b})`, [{ coef: 1, term: `${v}^2` }, { coef: a + b, term: v }, { coef: a * b, term: '' }], 'products');
            if (difficulty >= 3) add(`(${v} - ${a})(${v} + ${b})`, [{ coef: 1, term: `${v}^2` }, { coef: b - a, term: v }, { coef: -a * b, term: '' }], 'products');
            if (difficulty >= 4) {
              const k = Math.min(max, difficulty);
              add(`(${k}${v} + ${a})(${v} + ${b})`, [{ coef: k, term: `${v}^2` }, { coef: k * b + a, term: v }, { coef: a * b, term: '' }], 'products');
            }
            if (vars.length > 1 && difficulty >= 4) add(`(${v} + ${a})(${v} + ${w})`, [{ coef: 1, term: `${v}^2` }, { coef: 1, term: `${v}${w}` }, { coef: a, term: v }, { coef: a, term: w }], 'products');
          }
        }
        if (subtype === 'binomial') {
          const binomialLimit = max;
          const leadingCoeffLimit = Math.min(max, difficulty + 1);
          const leadingCoeffs = Array.from({ length: Math.max(0, leadingCoeffLimit - 1) }, (_, i) => i + 2);
          for (const variable of vars) {
            for (let a = 1; a <= binomialLimit; a++) {
              add(`(${variable} + ${a})²`, [{ coef: 1, term: `${variable}^2` }, { coef: 2 * a, term: variable }, { coef: a * a, term: '' }], 'binomial');
              if (difficulty >= 2) add(`(${variable} - ${a})²`, [{ coef: 1, term: `${variable}^2` }, { coef: -2 * a, term: variable }, { coef: a * a, term: '' }], 'binomial');
              if (difficulty >= 3) for (const k of leadingCoeffs) {
                add(`(${k}${variable} + ${a})²`, [{ coef: k * k, term: `${variable}^2` }, { coef: 2 * k * a, term: variable }, { coef: a * a, term: '' }], 'binomial');
              }
              if (difficulty >= 4) for (const k of leadingCoeffs) {
                add(`(${k}${variable} - ${a})²`, [{ coef: k * k, term: `${variable}^2` }, { coef: -2 * k * a, term: variable }, { coef: a * a, term: '' }], 'binomial');
              }
              if (difficulty >= 5) add(`(${variable} - ${a})(${variable} + ${a})`, [{ coef: 1, term: `${variable}^2` }, { coef: -a * a, term: '' }], 'binomial');
            }
          }
        }
      }
      return balancedTermTasks(allowNegatives ? tasks : tasks.filter(task => !task.label.includes('-')));
    }

    function buildTermCards(params) {
      return uniqBy(buildTermTasks(params).map(t => ({
        id: `term-target:${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetLabel
      })), e => e.targetKey).sort((a, b) => a.label.localeCompare(b.label));
    }

    function buildEquationTasks(params) {
      const variable = params.eqVariable || 'x';
      const min = clampNumber(params.eqMin, -30, 30, -10);
      const max = clampNumber(params.eqMax, -30, 30, 10);
      const difficulty = clampNumber(params.eqDifficulty, 1, 5, 3);
      const coeffMax = clampNumber(params.eqCoeffMax ?? Math.min(12, Math.max(2, difficulty * 2 + 1)), 2, 12, 7);
      const constantMax = clampNumber(params.eqConstantMax ?? Math.min(30, Math.max(4, difficulty * 5)), 2, 30, 15);
      const minSolution = Math.min(min, max);
      const maxSolution = Math.max(min, max);
      const solutions = [];
      for (let x = minSolution; x <= maxSolution; x++) if (params.eqAllowNegative || x >= 0) solutions.push(x);
      const type = params.eqType || 'mixed';
      const allowed = type === 'mixed' ? ['add', 'multiply', 'linear', 'bothSides', params.eqBrackets ? 'brackets' : 'linear', 'negative'] : [type];
      const tasks = [];
      const seen = new Set();
      const add = (display, x, subtype) => addUniqueTask(tasks, seen, {
        id: `eq:${subtype}:${display}`,
        targetKey: `${variable}=${x}`,
        label: display,
        targetLabel: `${variable} = ${x}`,
        subtype
      });
      const allowNegativeNumbers = params.eqAllowNegativeNumbers !== false && params.eqAllowNegativeNumbers !== '0';
      const bValues = [];
      for (let b = allowNegativeNumbers ? -constantMax : 1; b <= constantMax; b++) {
        if (b !== 0) bValues.push(b);
      }
      for (const x of solutions) {
        for (let a = 1; a <= coeffMax; a++) {
          const aValues = allowNegativeNumbers && a > 1 ? [a, -a] : [a];
          for (const signedA of aValues) {
            for (const subtype of allowed) {
              if (subtype === 'add' || subtype === 'negative') {
                for (const b of bValues.slice(0, difficulty * 4 + 4)) {
                  if (subtype !== 'negative' || x < 0 || b < 0 || x + b < 0) add(`${variable} ${b < 0 ? '-' : '+'} ${Math.abs(b)} = ${x + b}`, x, subtype);
                }
              }
              if (subtype === 'multiply' && Math.abs(signedA) !== 1) add(`${formatVarTerm(signedA, variable)} = ${signedA * x}`, x, 'multiply');
              if (subtype === 'linear') {
                for (const b of bValues) {
                  add(`${formatVarTerm(signedA, variable)} ${b < 0 ? '-' : '+'} ${Math.abs(b)} = ${signedA * x + b}`, x, 'linear');
                }
              }
              if (subtype === 'bothSides') {
                const otherCoeffs = [1, 2, 3, 4, 5].filter(c => c !== signedA && Math.abs(c) <= coeffMax);
                for (const c of otherCoeffs.slice(0, Math.max(1, difficulty))) {
                  for (const b of bValues.slice(0, difficulty + 3)) {
                    const d = (signedA - c) * x + b;
                    add(`${formatVarTerm(signedA, variable)} ${b < 0 ? '-' : '+'} ${Math.abs(b)} = ${formatVarTerm(c, variable)} ${d < 0 ? '-' : '+'} ${Math.abs(d)}`, x, 'bothSides');
                  }
                }
              }
              if (subtype === 'brackets') {
                for (const b of bValues.slice(0, difficulty + 5)) {
                  if (Math.abs(signedA) !== 1) add(`${signedA}(${variable} ${b < 0 ? '-' : '+'} ${Math.abs(b)}) = ${signedA * (x + b)}`, x, 'brackets');
                }
              }
            }
          }
        }
      }
      return tasks;
    }

    function buildEquationCards(params) {
      return uniqBy(buildEquationTasks(params).map(t => ({
        id: `eq-target:${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetLabel
      })), e => e.targetKey).sort((a, b) => {
        const av = Number(a.targetKey.split('=')[1]);
        const bv = Number(b.targetKey.split('=')[1]);
        return av - bv;
      });
    }

    function buildVertexTasks(params) {
      const range = clampNumber(params.vertexRange ?? params.n, 2, 20, 6);
      const coeffMax = clampNumber(params.vertexCoeffMax, 1, 8, 3);
      const allowNegativeA = params.vertexAllowNegativeA !== false && params.vertexAllowNegativeA !== '0';
      const taskType = params.vertexTaskType || 'vertex';
      const aValues = [];
      for (let a = 1; a <= coeffMax; a++) {
        aValues.push(a);
        if (allowNegativeA) aValues.push(-a);
      }
      const tasks = [];
      const seen = new Set();
      if (taskType === 'zeros') {
        const zeroRadius = Math.max(1, Math.min(3, Math.floor(range / 2)));
        for (let b = -range; b <= range; b++) {
          for (let r = 0; r <= zeroRadius; r++) {
            const x1 = b - r;
            const x2 = b + r;
            if (x1 < -range || x2 > range) continue;
            for (const a of aValues) {
              const c = -a * r * r;
              const formula = formatVertexFunction(a, b, c);
              addUniqueTask(tasks, seen, {
                id: `vertex:zeros:${a}:${b}:${r}`,
                kind: 'graph',
                graphType: 'quadratic',
                a,
                b,
                c,
                x1,
                x2,
                targetKey: `quadZeros:${x1}:${x2}`,
                targetLabel: formatQuadraticZeros(x1, x2),
                label: formula,
                subtype: 'zeros'
              });
            }
          }
        }
        return tasks;
      }
      for (let b = -range; b <= range; b++) {
        for (let c = -range; c <= range; c++) {
          for (const a of aValues) {
            const formula = formatVertexFunction(a, b, c);
            const base = {
              a,
              b,
              c,
              graphType: 'quadratic',
              label: formula
            };
            if (taskType === 'graphToFormula') {
              addUniqueTask(tasks, seen, {
                ...base,
                id: `vertex:graphToFormula:${a}:${b}:${c}`,
                kind: 'graph',
                targetKey: `vertexFormula:${a}:${b}:${c}`,
                targetLabel: formula,
                subtype: 'graphToFormula'
              });
            } else if (taskType === 'formulaToGraph') {
              addUniqueTask(tasks, seen, {
                ...base,
                id: `vertex:formulaToGraph:${a}:${b}:${c}`,
                targetKey: `vertexGraph:${a}:${b}:${c}`,
                targetLabel: formula,
                subtype: 'formulaToGraph'
              });
            } else {
              addUniqueTask(tasks, seen, {
                id: `vertex:${a}:${b}:${c}`,
                ...base,
                targetKey: `${b}|${c}`,
                targetLabel: `S(${b}|${c})`
              });
            }
          }
        }
      }
      return tasks;
    }

    function buildVertexCards(params) {
      return uniqBy(buildVertexTasks(params).map(t => {
        if (t.subtype === 'formulaToGraph') return {
          id: `vertex-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          kind: 'graph',
          graphType: 'quadratic',
          a: t.a,
          b: t.b,
          c: t.c
        };
        if (t.subtype === 'zeros') return {
          id: `vertex-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          x1: t.x1,
          x2: t.x2
        };
        return {
          id: `vertex-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          b: t.b,
          c: t.c
        };
      }), e => e.targetKey).sort((a, b) => (a.b ?? 0) - (b.b ?? 0) || (a.c ?? 0) - (b.c ?? 0) || String(a.label).localeCompare(String(b.label), 'de', { numeric: true }));
    }

    function buildPowerRootTasks(params) {
      const maxBase = clampNumber(params.powerRootMaxBase ?? params.n, 2, 30, 20);
      const type = params.powerRootType || 'mixed';
      const includeSquares = type === 'mixed' || type === 'squares';
      const includeRoots = type === 'mixed' || type === 'roots';
      const tasks = [];
      const seen = new Set();
      for (let base = 1; base <= maxBase; base++) {
        const square = base * base;
        if (includeSquares) addUniqueTask(tasks, seen, {
          id: `power:square:${base}`,
          base,
          square,
          targetKey: String(square),
          label: `${base}²`,
          targetLabel: String(square),
          subtype: 'square'
        });
        if (includeRoots) addUniqueTask(tasks, seen, {
          id: `power:root:${square}`,
          base,
          radicand: square,
          targetKey: String(base),
          label: `√${square}`,
          targetLabel: String(base),
          subtype: 'root'
        });
      }
      return tasks;
    }

    function buildPowerRootCards(params) {
      return uniqBy(buildPowerRootTasks(params).map(t => ({
        id: `power-target:${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetLabel,
        value: Number(t.targetKey)
      })), e => e.targetKey).sort((a, b) => a.value - b.value);
    }

    function buildPercentTasks(params) {
      const maxBase = clampNumber(params.percentMaxBase ?? params.n, 20, 1000, 200);
      const maxRate = clampNumber(params.percentMaxRate ?? 90, 5, 100, 90);
      const type = params.percentType || 'mixed';
      const allowed = type === 'mixed'
        ? ['percentValue', 'baseValue', 'rate', 'discount', 'increase']
        : [type];
      const percentValues = [5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 100].filter(v => v <= maxRate);
      const rateOnlyPercentValues = [35, 45, 55, 65, 85, 95].filter(v => v <= maxRate);
      const baseValues = [20, 30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 180, 200, 240, 250, 300, 320, 400, 500, 600, 800, 1000].filter(v => v <= maxBase);
      const moneyValues = [20, 40, 50, 60, 80, 100, 120, 150, 160, 200, 240, 300, 400, 500, 600, 800, 1000].filter(v => v <= maxBase);
      const tasks = [];
      const seen = new Set();
      const add = (id, label, targetKey, targetLabel, subtype) => addUniqueTask(tasks, seen, { id, label, targetKey, targetLabel, subtype });

      for (const p of percentValues) {
        for (const base of baseValues) {
          const part = base * p / 100;
          if (!Number.isInteger(part)) continue;
          if (allowed.includes('percentValue')) add(`percent:value:${p}:${base}`, `${p} % von ${base}`, `num:${part}`, String(part), 'percentValue');
          if (allowed.includes('baseValue')) add(`percent:base:${part}:${p}:${base}`, `${part} sind ${p} % von ?`, `num:${base}`, String(base), 'baseValue');
          if (allowed.includes('rate') && part > 0) add(`percent:rate:${part}:${base}`, `${part} von ${base}:\nwie viel Prozent?`, `pct:${p}`, `${p} %`, 'rate');
        }
        for (const price of moneyValues) {
          const discount = price * (100 - p) / 100;
          const increase = price * (100 + p) / 100;
          if (allowed.includes('discount') && Number.isInteger(discount)) add(`percent:discount:${price}:${p}`, `${price} € um ${p} % rabattiert\nEndpreis?`, `eur:${discount}`, `${discount} €`, 'discount');
          if (allowed.includes('increase') && Number.isInteger(increase)) add(`percent:increase:${price}:${p}`, `${price} € um ${p} % erhöht\nEndpreis?`, `eur:${increase}`, `${increase} €`, 'increase');
        }
      }
      if (allowed.includes('rate') && maxBase >= 100) {
        for (const p of rateOnlyPercentValues) {
          add(`percent:rate:${p}:100`, `${p} von 100:\nwie viel Prozent?`, `pct:${p}`, `${p} %`, 'rate');
        }
      }
      return tasks;
    }

    function buildPercentCards(params) {
      return uniqBy(buildPercentTasks(params).map(t => ({
        id: `percent-target:${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetLabel
      })), e => e.targetKey).sort((a, b) => a.label.localeCompare(b.label, 'de', { numeric: true }));
    }

    function formatLinearFunction(m, b, x) {
      const slope = m === 1 ? 'x' : m === -1 ? '-x' : `${m}x`;
      const intercept = b === 0 ? '' : ` ${b < 0 ? '-' : '+'} ${Math.abs(b)}`;
      return `y = ${slope}${intercept}, x = ${x}`;
    }

    function formatLinearFormula(m, b) {
      const slope = m === 1 ? 'x' : m === -1 ? '-x' : `${m}x`;
      const intercept = b === 0 ? '' : ` ${b < 0 ? '-' : '+'} ${Math.abs(b)}`;
      return `y = ${slope}${intercept}`;
    }

    function formatLinearXTask(m, b, y) {
      return `${formatLinearFormula(m, b)}\ny = ${y}, x gesucht`;
    }

    function buildLinearFunctionTasks(params) {
      const slopeMax = clampNumber(params.linearFunctionSlopeMax, 1, 12, 5);
      const xMin = clampNumber(params.linearFunctionXMin, -20, 20, -5);
      const xMax = clampNumber(params.linearFunctionXMax, -20, 20, 10);
      const bMax = clampNumber(params.linearFunctionBMax, 0, 30, 10);
      const allowNegativeSlopes = params.linearFunctionNegativeSlopes !== false && params.linearFunctionNegativeSlopes !== '0';
      const allowNegativeIntercepts = params.linearFunctionNegativeIntercepts !== false && params.linearFunctionNegativeIntercepts !== '0';
      const taskType = params.linearFunctionTaskType || 'yValue';
      const minX = Math.min(xMin, xMax);
      const maxX = Math.max(xMin, xMax);
      const tasks = [];
      const seen = new Set();
      const slopes = [];
      for (let m = 1; m <= slopeMax; m++) {
        slopes.push(m);
        if (allowNegativeSlopes) slopes.push(-m);
      }
      const intercepts = allowNegativeIntercepts
        ? Array.from({ length: bMax * 2 + 1 }, (_, i) => i - bMax)
        : Array.from({ length: bMax + 1 }, (_, i) => i);
      for (const m of slopes) {
        for (const b of intercepts) {
          const formula = formatLinearFormula(m, b);
          if (taskType === 'graphToFormula') {
            addUniqueTask(tasks, seen, {
              id: `linearFunction:graphToFormula:${m}:${b}`,
              kind: 'graph',
              graphType: 'linear',
              m,
              b,
              targetKey: `line:${m}:${b}`,
              targetLabel: formula,
              label: formula,
              subtype: 'graphToFormula'
            });
          } else if (taskType === 'formulaToGraph') {
            addUniqueTask(tasks, seen, {
              id: `linearFunction:formulaToGraph:${m}:${b}`,
              graphType: 'linear',
              m,
              b,
              targetKey: `lineGraph:${m}:${b}`,
              targetLabel: formula,
              label: formula,
              subtype: 'formulaToGraph'
            });
          } else if (taskType === 'zero') {
            if (b % m !== 0) continue;
            const zero = -b / m;
            if (zero < minX || zero > maxX) continue;
            addUniqueTask(tasks, seen, {
              id: `linearFunction:zero:${m}:${b}`,
              m,
              b,
              x: zero,
              targetKey: `x0:${zero}`,
              targetLabel: `x = ${zero}`,
              label: `${formula}\nNullstelle?`,
              subtype: 'zero'
            });
          } else if (taskType === 'xValue') {
            for (let x = minX; x <= maxX; x++) {
              const y = m * x + b;
              addUniqueTask(tasks, seen, {
                id: `linearFunction:x:${m}:${b}:${x}`,
                m,
                b,
                x,
                y,
                targetKey: `x:${x}`,
                targetLabel: `x = ${x}`,
                label: formatLinearXTask(m, b, y),
                subtype: 'xValue'
              });
            }
          } else {
            for (let x = minX; x <= maxX; x++) {
              const y = m * x + b;
              addUniqueTask(tasks, seen, {
                id: `linearFunction:y:${m}:${b}:${x}`,
                m,
                b,
                x,
                y,
                targetKey: `y:${y}`,
                targetLabel: String(y),
                label: formatLinearFunction(m, b, x),
                subtype: 'yValue'
              });
            }
          }
        }
      }
      return tasks;
    }

    function buildLinearFunctionCards(params) {
      return uniqBy(buildLinearFunctionTasks(params).map(t => {
        if (t.subtype === 'formulaToGraph') return {
          id: `linear-function-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          kind: 'graph',
          graphType: 'linear',
          m: t.m,
          b: t.b,
          value: t.m * 100 + t.b
        };
        if (t.subtype === 'graphToFormula') return {
          id: `linear-function-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          value: t.m * 100 + t.b
        };
        const numeric = Number(String(t.targetKey).split(':')[1]);
        return {
          id: `linear-function-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          value: Number.isFinite(numeric) ? numeric : t.m * 100 + t.b
        };
      }), e => e.targetKey).sort((a, b) => a.value - b.value || String(a.label).localeCompare(String(b.label), 'de', { numeric: true }));
    }

    const GEOMETRY_SHAPES = [
      { key: 'square', label: 'Quadrat', area: 'A = a²', perimeter: 'U = 4a', values: [{ a: 4 }, { a: 6 }, { a: 8 }, { a: 10 }, { a: 12 }] },
      { key: 'rectangle', label: 'Rechteck', area: 'A = a · b', perimeter: 'U = 2 · (a + b)', values: [{ a: 6, b: 4 }, { a: 8, b: 5 }, { a: 10, b: 6 }, { a: 12, b: 7 }] },
      { key: 'triangle', label: 'Dreieck', area: 'A = g · h : 2', perimeter: 'U = a + b + c', values: [{ g: 6, h: 4, a: 5, b: 5, c: 6 }, { g: 12, h: 8, a: 10, b: 10, c: 12 }, { g: 16, h: 6, a: 10, b: 10, c: 16 }] },
      { key: 'parallelogram', label: 'Parallelogramm', area: 'A = g · h', perimeter: 'U = 2 · (a + b)', values: [{ g: 7, h: 4, a: 7, b: 5 }, { g: 9, h: 5, a: 9, b: 6 }, { g: 11, h: 6, a: 11, b: 7 }] },
      { key: 'trapezoid', label: 'Trapez', area: 'A = (a + c) · h : 2', perimeter: 'U = a + b + c + d', values: [{ a: 12, c: 6, h: 4, b: 5, d: 5 }, { a: 18, c: 6, h: 8, b: 10, d: 10 }, { a: 20, c: 4, h: 6, b: 10, d: 10 }] },
      { key: 'rhombus', label: 'Raute', area: 'A = e · f : 2', perimeter: 'U = 4a', values: [{ a: 5, e: 8, f: 6 }, { a: 10, e: 16, f: 12 }, { a: 13, e: 24, f: 10 }] },
      { key: 'circle', label: 'Kreis', area: 'A = π · r²', perimeter: 'U = 2 · π · r', values: [{ r: 3 }, { r: 4 }, { r: 5 }, { r: 6 }, { r: 8 }] }
    ];
    const GEOMETRY_ALL_SHAPES_MASK = (1 << GEOMETRY_SHAPES.length) - 1;

    function shapeMaskFromValue(value) {
      const n = Number(value);
      if (Number.isFinite(n)) return Math.max(1, Math.min(GEOMETRY_ALL_SHAPES_MASK, n));
      return GEOMETRY_ALL_SHAPES_MASK;
    }

    function activeGeometryShapes(mask) {
      const safeMask = shapeMaskFromValue(mask);
      return GEOMETRY_SHAPES.filter((shape, index) => safeMask & (1 << index));
    }

    function substituteGeometryFormula(formula, values) {
      return substituteSolidFormula(formula, values);
    }

    function formatGeometryNumber(value) {
      return Number.isInteger(value) ? String(value) : String(value).replace('.', ',');
    }

    function geometryResult(shape, measure, values) {
      if (!values || !Object.keys(values).length) return '';
      if (shape.key === 'circle') {
        const coeff = measure === 'area' ? values.r * values.r : 2 * values.r;
        return coeff === 1 ? 'π' : `${coeff}π`;
      }
      const result = {
        square: measure === 'area' ? values.a * values.a : 4 * values.a,
        rectangle: measure === 'area' ? values.a * values.b : 2 * (values.a + values.b),
        triangle: measure === 'area' ? values.g * values.h / 2 : values.a + values.b + values.c,
        parallelogram: measure === 'area' ? values.g * values.h : 2 * (values.a + values.b),
        trapezoid: measure === 'area' ? (values.a + values.c) * values.h / 2 : values.a + values.b + values.c + values.d,
        rhombus: measure === 'area' ? values.e * values.f / 2 : 4 * values.a
      }[shape.key];
      return formatGeometryNumber(result);
    }

    function geometryCardAnswer(shape, measure, variant, answerMode) {
      if (variant.labelMode !== 'numbers') return { key: `geometryFormula:${measure}:${variant.labelMode}:${variant.formula}`, label: variant.formula };
      const result = `${geometryResult(shape, measure, variant.values)} ${geometryUnit(measure)}`;
      if (answerMode === 'resultOnly') return { key: `geometryResult:${result}`, label: result };
      return { key: `geometryEquation:${measure}:${variant.formula}:${result}`, label: `${variant.formula} = ${result}` };
    }

    function geometryTaskVariants(shape, measure, labelMode) {
      const formula = shape[measure];
      const variants = [];
      if (labelMode === 'letters' || labelMode === 'mixed') variants.push({ values: {}, formula, labelMode: 'letters' });
      if (labelMode === 'numbers' || labelMode === 'mixed') {
        shape.values.forEach(values => variants.push({ values, formula: substituteGeometryFormula(formula, values), labelMode: 'numbers' }));
      }
      return variants;
    }

    function buildGeometryTasks(params) {
      const taskType = params.geometryTaskType || 'mixed';
      const labelMode = params.geometryLabelMode || 'mixed';
      const answerMode = params.geometryAnswerMode || 'equationResult';
      const measures = taskType === 'mixed' || taskType === 'formulaToFigure' ? ['area', 'perimeter'] : [taskType];
      const tasks = [];
      const seen = new Set();
      for (const shape of activeGeometryShapes(params.geometryShapeMask)) {
        for (const measure of measures) {
          for (const variant of geometryTaskVariants(shape, measure, labelMode)) {
            const measureLabel = measure === 'area' ? 'Fläche' : 'Umfang';
            const id = `geometry:${taskType}:${shape.key}:${measure}:${variant.labelMode}:${variant.formula}`;
            const cardAnswer = geometryCardAnswer(shape, measure, variant, answerMode);
            if (taskType === 'formulaToFigure') {
              addUniqueTask(tasks, seen, {
                id,
                label: `${measureLabel}\n${variant.formula}\nMarkiere alle passenden Figuren.${variant.labelMode === 'numbers' ? ' Längen in cm.' : ''}`,
                targetKey: `geometryFigure:${shape.key}:${measure}:${variant.labelMode}:${variant.formula}`,
                targetLabel: `${shape.label} (${measureLabel})`,
                kind: 'formula',
                shapeKey: shape.key,
                shapeLabel: shape.label,
                measure,
                values: variant.values,
                labelMode: variant.labelMode,
                subtype: taskType
              });
            } else {
              addUniqueTask(tasks, seen, {
                id,
                label: measure === 'area' ? 'Flächeninhalt A' : 'Umfang U',
                answerMode,
                targetKey: cardAnswer.key,
                targetLabel: cardAnswer.label,
                kind: 'geometryFigure',
                shapeKey: shape.key,
                shapeLabel: shape.label,
                measure,
                values: variant.values,
                labelMode: variant.labelMode,
                subtype: measure
              });
            }
          }
        }
      }
      return tasks;
    }

    function buildGeometryCards(params) {
      return uniqBy(buildGeometryTasks(params).map(t => {
        if (t.subtype === 'formulaToFigure') return {
          id: `geometry-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel,
          kind: 'geometryFigure',
          shapeKey: t.shapeKey,
          shapeLabel: t.shapeLabel,
          measure: t.measure,
          values: t.values,
          labelMode: t.labelMode
        };
        return {
          id: `geometry-target:${t.targetKey}`,
          targetKey: t.targetKey,
          label: t.targetLabel
        };
      }), e => e.targetKey).sort((a, b) => String(a.label).localeCompare(String(b.label), 'de', { numeric: true }));
    }

    function piLabel(coeff) {
      if (coeff === 0) return '0';
      if (coeff === 1) return 'π';
      if (Number.isInteger(coeff)) return `${coeff}π`;
      return `${formatGeometryNumber(coeff)}π`;
    }

    const GEOMETRY_SOLIDS = [
      { key: 'cube', label: 'Würfel', values: [{ a: 3 }, { a: 4 }, { a: 5 }, { a: 6 }, { a: 8 }] },
      { key: 'cuboid', label: 'Quader', values: [{ a: 4, b: 3, h: 5 }, { a: 6, b: 4, h: 5 }, { a: 8, b: 5, h: 6 }, { a: 10, b: 6, h: 7 }] },
      { key: 'prism', label: 'Prisma', values: [{ a: 3, b: 4, c: 5, G: 6, u: 12, h: 5 }, { a: 6, b: 8, c: 10, G: 24, u: 24, h: 6 }, { a: 5, b: 12, c: 13, G: 30, u: 30, h: 7 }, { a: 8, b: 15, c: 17, G: 60, u: 40, h: 8 }] },
      { key: 'cylinder', label: 'Zylinder', values: [{ r: 3, h: 5 }, { r: 4, h: 6 }, { r: 5, h: 8 }, { r: 6, h: 10 }] },
      { key: 'cone', label: 'Kegel', values: [{ r: 3, h: 4, s: 5 }, { r: 6, h: 8, s: 10 }, { r: 5, h: 12, s: 13 }, { r: 8, h: 15, s: 17 }] },
      { key: 'pyramid', label: 'Pyramide', values: [{ a: 6, h: 4, s: 5 }, { a: 12, h: 8, s: 10 }, { a: 10, h: 12, s: 13 }, { a: 16, h: 15, s: 17 }] },
      { key: 'sphere', label: 'Kugel', values: [{ r: 3 }, { r: 6 }, { r: 9 }, { r: 12 }] }
    ];
    const GEOMETRY_ALL_SOLIDS_MASK = (1 << GEOMETRY_SOLIDS.length) - 1;

    function solidMaskFromValue(value) {
      const n = Number(value);
      if (Number.isFinite(n)) return Math.max(1, Math.min(GEOMETRY_ALL_SOLIDS_MASK, n));
      return GEOMETRY_ALL_SOLIDS_MASK;
    }

    function activeGeometrySolids(mask) {
      const safeMask = solidMaskFromValue(mask);
      return GEOMETRY_SOLIDS.filter((solid, index) => safeMask & (1 << index));
    }

    function geometrySolidMeasures(solid, taskType) {
      const all = solid.key === 'sphere'
        ? ['volume', 'surface']
        : ['volume', 'surface', 'lateral', 'base'];
      return taskType === 'mixed' ? all : all.filter(measure => measure === taskType);
    }

    function geometrySolidFormula(solid, measure) {
      const formulas = {
        cube: { volume: 'V = a³', surface: 'O = 6a²', lateral: 'M = 4a²', base: 'G = a²' },
        cuboid: { volume: 'V = a · b · h', surface: 'O = 2(ab + ah + bh)', lateral: 'M = 2h(a + b)', base: 'G = a · b' },
        prism: { volume: 'V = a · b · h : 2', surface: 'O = a · b + (a + b + c) · h', lateral: 'M = (a + b + c) · h', base: 'G = a · b : 2' },
        cylinder: { volume: 'V = π · r² · h', surface: 'O = 2πr² + 2πrh', lateral: 'M = 2πrh', base: 'G = πr²' },
        cone: { volume: 'V = π · r² · h : 3', surface: 'O = πr² + πrs', lateral: 'M = πrs', base: 'G = πr²' },
        pyramid: { volume: 'V = a² · h : 3', surface: 'O = a² + 2as', lateral: 'M = 2as', base: 'G = a²' },
        sphere: { volume: 'V = 4πr³ : 3', surface: 'O = 4πr²' }
      };
      return formulas[solid.key][measure];
    }

    function geometrySolidResult(solid, measure, values) {
      if (solid.key === 'cube') return formatGeometryNumber({ volume: values.a ** 3, surface: 6 * values.a ** 2, lateral: 4 * values.a ** 2, base: values.a ** 2 }[measure]);
      if (solid.key === 'cuboid') return formatGeometryNumber({
        volume: values.a * values.b * values.h,
        surface: 2 * (values.a * values.b + values.a * values.h + values.b * values.h),
        lateral: 2 * values.h * (values.a + values.b),
        base: values.a * values.b
      }[measure]);
      if (solid.key === 'prism') return formatGeometryNumber({ volume: values.G * values.h, surface: 2 * values.G + values.u * values.h, lateral: values.u * values.h, base: values.G }[measure]);
      if (solid.key === 'cylinder') return piLabel({ volume: values.r * values.r * values.h, surface: 2 * values.r * values.r + 2 * values.r * values.h, lateral: 2 * values.r * values.h, base: values.r * values.r }[measure]);
      if (solid.key === 'cone') return piLabel({ volume: values.r * values.r * values.h / 3, surface: values.r * values.r + values.r * values.s, lateral: values.r * values.s, base: values.r * values.r }[measure]);
      if (solid.key === 'pyramid') return formatGeometryNumber({ volume: values.a * values.a * values.h / 3, surface: values.a * values.a + 2 * values.a * values.s, lateral: 2 * values.a * values.s, base: values.a * values.a }[measure]);
      if (solid.key === 'sphere') return piLabel({ volume: 4 * values.r * values.r * values.r / 3, surface: 4 * values.r * values.r }[measure]);
      return '';
    }

    // Explicit products before substitution prevent 4a -> 44 and hidden factors.
    function substituteSolidFormula(formula, values) {
      const explicit = formula.replace(/u_G/g, 'u').replace(/([0-9πa-z²³)])(?=[πa-z(])/g, '$1 · ');
      const [left, right] = explicit.split(' = ');
      return `${left} = ${right.replace(/[a-zG]/g, key => values[key] != null ? formatGeometryNumber(values[key]) : key)}`;
    }

    function geometryUnit(measure) {
      return measure === 'perimeter' ? 'cm' : measure === 'volume' ? 'cm³' : 'cm²';
    }

    function geometrySolidCardAnswer(solid, measure, variant, answerMode) {
      if (variant.labelMode === 'letters') return { key: `solidFormula:${solid.key}:${measure}`, label: geometrySolidFormula(solid, measure) };
      const result = `${geometrySolidResult(solid, measure, variant.values)} ${geometryUnit(measure)}`;
      if (answerMode === 'resultOnly') return { key: `solidResult:${result}`, label: result };
      return { key: `solidEquation:${solid.key}:${measure}:${variant.formula}:${result}`, label: `${variant.formula} = ${result}` };
    }

    function geometrySolidVariants(solid, measure, labelMode) {
      const variants = [];
      if (labelMode === 'letters' || labelMode === 'mixed') variants.push({ labelMode: 'letters', formula: geometrySolidFormula(solid, measure), values: {} });
      if (labelMode === 'numbers' || labelMode === 'mixed') {
        solid.values.forEach(values => variants.push({ labelMode: 'numbers', formula: substituteSolidFormula(geometrySolidFormula(solid, measure), values), values }));
      }
      return variants;
    }

    function solidTaskLabel(solid, measure, variant, answerMode) {
      const names = { volume: 'Volumen V', surface: 'Oberfläche O', lateral: 'Mantelfläche M', base: 'Grundfläche G' };
      const symbols = { cube: ['a'], cuboid: ['a', 'b', 'h'], prism: ['a', 'b', 'c', 'h'], cylinder: ['r', 'h'], cone: ['r', 'h', 's'], pyramid: ['a', 'h', 's'], sphere: ['r'] }[solid.key];
      const special = { prism: 'Gerades Prisma; Grundfläche: rechtwinkliges Dreieck (a, b Katheten; c Hypotenuse)', pyramid: 'Gerade quadratische Pyramide', cone: 'Gerader Kreiskegel' };
      const legend = ['h: Körperhöhe', ...(solid.key === 'pyramid' ? ['s: Seitenhöhe'] : solid.key === 'cone' ? ['s: Mantellinie'] : [])].filter(x => symbols.includes(x[0])).join('; ');
      const data = symbols.map(key => variant.labelMode === 'numbers' ? `${key} = ${variant.values[key]} cm` : key).join(', ');
      return `${special[solid.key] || solid.label}\n${data}${legend ? `\n${legend}` : ''}\n${variant.labelMode === 'numbers' ? `Berechne: ${names[measure]}.\nAntwort: ${answerMode === 'resultOnly' ? 'Ergebnis mit Einheit' : 'passende Zahlenrechnung + Ergebnis mit Einheit'}.` : `Gib die Formel für ${names[measure]} an.`}`;
    }

    function buildGeometrySolidTasks(params) {
      const taskType = params.geometrySolidTaskType || 'mixed';
      const labelMode = params.geometrySolidLabelMode || 'mixed';
      const answerMode = params.geometrySolidAnswerMode || 'equationResult';
      const tasks = [];
      const seen = new Set();
      for (const solid of activeGeometrySolids(params.geometrySolidMask)) {
        for (const measure of geometrySolidMeasures(solid, taskType)) {
          for (const variant of geometrySolidVariants(solid, measure, labelMode)) {
            const cardAnswer = geometrySolidCardAnswer(solid, measure, variant, answerMode);
            addUniqueTask(tasks, seen, {
              id: `solid:${solid.key}:${measure}:${variant.labelMode}:${variant.formula}`,
              targetKey: cardAnswer.key,
              targetLabel: cardAnswer.label,
              label: solidTaskLabel(solid, measure, variant, answerMode),
              kind: 'geometrySolid',
              solidKey: solid.key,
              solidLabel: solid.label,
              measure,
              values: variant.values,
              formula: variant.formula,
              labelMode: variant.labelMode
            });
          }
        }
      }
      return tasks;
    }

    function buildGeometrySolidCards(params) {
      return uniqBy(buildGeometrySolidTasks(params).map(t => ({
        id: `solid-target:${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetLabel
      })), e => e.targetKey).sort((a, b) => String(a.label).localeCompare(String(b.label), 'de', { numeric: true }));
    }

    function buildPythagorasTriples(maxSide) {
      const triples = [];
      for (let a = 1; a <= maxSide; a++) {
        for (let b = a; b <= maxSide; b++) {
          const c2 = a * a + b * b;
          const c = Math.sqrt(c2);
          if (Number.isInteger(c) && c <= maxSide) triples.push({ a, b, c });
        }
      }
      return triples;
    }

    function pythagorasLabelSets(mode) {
      if (mode === 'xyz') return [{ legA: 'x', legB: 'y', hyp: 'z' }];
      if (mode === 'mixed') return [{ legA: 'a', legB: 'b', hyp: 'c' }, { legA: 'x', legB: 'y', hyp: 'z' }, { legA: 'p', legB: 'q', hyp: 'r' }];
      return [{ legA: 'a', legB: 'b', hyp: 'c' }];
    }

    function buildPythagorasTasks(params) {
      const maxSide = clampNumber(params.pythagorasMaxSide, 5, 40, 20);
      const taskType = params.pythagorasTaskType || 'mixed';
      const labels = pythagorasLabelSets(params.pythagorasLabels || 'abc');
      const triples = buildPythagorasTriples(maxSide);
      const tasks = [];
      const seen = new Set();
      const wanted = taskType === 'mixed' ? ['hypotenuse', 'leg'] : [taskType];
      for (const triple of triples) {
        for (const set of labels) {
          if (wanted.includes('hypotenuse')) {
            addUniqueTask(tasks, seen, {
              id: `pyth:h:${triple.a}:${triple.b}:${triple.c}:${set.hyp}`,
              targetKey: `pyth:${set.hyp}:${triple.c}`,
              targetLabel: `${set.hyp} = ${triple.c} cm`,
              label: `${set.legA} = ${triple.a}, ${set.legB} = ${triple.b}\n${set.hyp} gesucht`,
              kind: 'pythagorasFigure',
              triple,
              missing: 'hyp',
              labels: set
            });
          }
          if (wanted.includes('leg')) {
            addUniqueTask(tasks, seen, {
              id: `pyth:a:${triple.a}:${triple.b}:${triple.c}:${set.legA}`,
              targetKey: `pyth:${set.legA}:${triple.a}`,
              targetLabel: `${set.legA} = ${triple.a} cm`,
              label: `${set.legB} = ${triple.b}, ${set.hyp} = ${triple.c}\n${set.legA} gesucht`,
              kind: 'pythagorasFigure',
              triple,
              missing: 'legA',
              labels: set
            });
            addUniqueTask(tasks, seen, {
              id: `pyth:b:${triple.a}:${triple.b}:${triple.c}:${set.legB}`,
              targetKey: `pyth:${set.legB}:${triple.b}`,
              targetLabel: `${set.legB} = ${triple.b} cm`,
              label: `${set.legA} = ${triple.a}, ${set.hyp} = ${triple.c}\n${set.legB} gesucht`,
              kind: 'pythagorasFigure',
              triple,
              missing: 'legB',
              labels: set
            });
          }
        }
      }
      return tasks;
    }

    function buildPythagorasCards(params) {
      return uniqBy(buildPythagorasTasks(params).map(t => ({
        id: `pyth-target:${t.targetKey}`,
        targetKey: t.targetKey,
        label: t.targetLabel,
        value: parseFloat(t.targetLabel.split('=')[1])
      })), e => e.targetKey).sort((a, b) => a.value - b.value || String(a.label).localeCompare(String(b.label), 'de', { numeric: true }));
    }

    // G4: structured mental addition/subtraction. The bounded target selection,
    // candidate construction and mixed-family assignment are part of the contract.
    const SMART_FAMILIES = ['combine', 'addNear', 'subtractNear', 'bundle'];
    const SMART_POOL_CACHE = new Map();

    function smartResultRange(level, family) {
      const ranges = level === 'standard'
        ? { combine: [101, 1000], addNear: [100, 1000], subtractNear: [0, 903], bundle: [0, 900], mixed: [0, 1000] }
        : { combine: [11, 100], addNear: [11, 100], subtractNear: [1, 92], bundle: [0, 90], mixed: [0, 100] };
      return ranges[family];
    }

    function smartTargets(level, family) {
      const [lo, hi] = smartResultRange(level, family);
      const count = level === 'standard' ? 48 : 36;
      const landmarks = level === 'standard' ? [127, 230, 445, 449, 405, 401, 525, 500] : [37, 65, 54, 53];
      const values = new Set([lo, hi, ...landmarks.filter(n => n >= lo && n <= hi)]);
      // Spread across the full range, retaining endpoints and varied final digits.
      for (let i = 0; values.size < count; i++) {
        const n = lo + Math.round((hi - lo) * (i % count) / (count - 1));
        values.add(n);
        if (i >= count) for (let v = lo; v <= hi && values.size < count; v++) values.add(v);
      }
      return [...values].sort((a, b) => a - b);
    }

    function smartComplements(total, unit) {
      return [...new Set([Math.floor(total / 2) - 2, Math.floor(total / 2) + 3, Math.floor(total / 3) + 1, total - 7, 7, total - 13, 13])]
        .filter(a => a > 0 && a < total && a % unit !== 0 && (total - a) % unit !== 0);
    }

    function smartVariants(level, family, result) {
      const standard = level === 'standard', unit = standard ? 100 : 10, limit = standard ? 1000 : 100;
      const candidates = [], seen = new Set();
      const add = (label, variant, steps) => {
        if (seen.has(label)) return;
        seen.add(label);
        candidates.push({ id: `smart:${family}:${label}`, label, subtype: family, variant, targetKey: String(result), targetLabel: String(result), strategy: [label, ...steps, String(result)].join(' = ') });
      };
      for (let q = unit; q <= 9 * unit; q += unit) {
        if (family === 'combine') {
          const c = result - q;
          for (const a of smartComplements(q, unit)) {
            const b = q - a;
            if (c >= 1 && c <= (standard ? 199 : 29)) add(`${a} + ${c} + ${b}`, 'combine3', [`(${a} + ${b}) + ${c}`, `${q} + ${c}`]);
            if (standard) for (const e of [3, 7, 1, 9, 2, 5, 4, 6, 8]) {
              const middle = result - q - e;
              if (middle >= 1 && middle <= 99) add(`${a} + ${middle} + ${b} + ${e}`, 'combine4', [`(${a} + ${b}) + (${middle} + ${e})`, `${q} + ${middle + e}`]);
            }
          }
        }
        if (family === 'addNear' || family === 'subtractNear') {
          for (const delta of (standard ? [-2, 2, -1, 1, -3, 3] : [-1, -2])) {
            const near = q + delta, below = delta < 0, sign = below ? '−' : '+', amount = Math.abs(delta);
            if (family === 'addNear') {
              const b = result - near;
              if (b >= 3 && b <= (standard ? 199 : 29) && result <= limit) {
                const steps = [`${q} + (${b} ${sign} ${amount})`, `${q} + ${b + delta}`];
                add(`${near} + ${b}`, below ? 'addBelowLeft' : 'addAboveLeft', steps);
                if (standard) add(`${b} + ${near}`, below ? 'addBelowRight' : 'addAboveRight', steps);
              }
            } else {
              const a = result + near;
              if (a <= limit && a >= Math.max(q, near)) add(`${a} − ${near}`, below ? 'subtractBelow' : 'subtractAbove', [`${a} − ${q} ${below ? '+' : '−'} ${amount}`]);
            }
          }
        }
        if (family === 'bundle') for (const b of smartComplements(q, unit)) {
          const c = q - b, a = result + q;
          if (a <= limit) add(`${a} − ${b} − ${c}`, 'bundle2', [`${a} − (${b} + ${c})`, `${a} − ${q}`]);
          if (standard) for (const d of [25, 5, 7, 13, 1, 2, 3, 9]) {
            const start = a + d;
            if (start <= limit) add(`${start} − ${b} − ${c} − ${d}`, 'bundle3', [`${start} − (${b} + ${c}) − ${d}`, `${start} − ${q} − ${d}`]);
          }
        }
      }
      // Reserve each structural variant before filling up to eight expressions.
      const groups = new Map();
      for (const task of candidates) {
        if (!groups.has(task.variant)) groups.set(task.variant, []);
        groups.get(task.variant).push(task);
      }
      const tasks = [];
      for (let i = 0; tasks.length < 8; i++) {
        let added = false;
        for (const group of groups.values()) if (group[i] && tasks.length < 8) { tasks.push(group[i]); added = true; }
        if (!added) break;
      }
      return tasks;
    }

    function smartFamilyAssignment(targets, level) {
      const quota = targets.length / 4, assigned = new Map(), slots = new Map(SMART_FAMILIES.map(f => [f, []]));
      const eligible = n => SMART_FAMILIES.filter(f => { const [lo, hi] = smartResultRange(level, f); return n >= lo && n <= hi; });
      function place(n, visited) {
        for (const family of eligible(n)) {
          if (visited.has(family)) continue;
          visited.add(family);
          const group = slots.get(family);
          if (group.length < quota) { group.push(n); assigned.set(n, family); return true; }
          for (let i = 0; i < group.length; i++) {
            const previous = group[i];
            if (place(previous, visited)) { group[i] = n; assigned.set(n, family); return true; }
          }
        }
        return false;
      }
      for (const n of [...targets].sort((a, b) => eligible(a).length - eligible(b).length || a - b)) {
        if (!place(n, new Set())) throw new Error('Die Strategiefamilien können nicht ausgewogen verteilt werden. Der bisherige Satz bleibt erhalten.');
      }
      return assigned;
    }

    function buildSmartPool(params) {
      const level = params.smartLevel || 'easy', family = params.smartFamily || 'mixed';
      if (!['easy', 'standard'].includes(level) || !['mixed', ...SMART_FAMILIES].includes(family)) throw new Error('Unbekannte Stufe oder Strategiefamilie für Schlau rechnen.');
      const key = `${level}:${family}`;
      if (SMART_POOL_CACHE.has(key)) return SMART_POOL_CACHE.get(key);
      const targets = smartTargets(level, family), tasks = [];
      for (const result of targets) for (const f of (family === 'mixed' ? SMART_FAMILIES : [family])) {
        const [lo, hi] = smartResultRange(level, f);
        if (result < lo || result > hi) continue;
        const variants = smartVariants(level, f, result);
        if (!variants.length) throw new Error('Eine vorgesehene Zahlbeziehung fehlt. Der bisherige Satz bleibt erhalten.');
        tasks.push(...variants);
      }
      const assignment = family === 'mixed' ? smartFamilyAssignment(targets, level) : new Map(targets.map(n => [n, family]));
      const pool = { tasks, targets, assignment };
      SMART_POOL_CACHE.set(key, pool);
      return pool;
    }

    function buildSmartTasks(params) { return buildSmartPool(params).tasks; }

    function buildSmartCards(params) {
      return buildSmartPool(params).targets.map(n => ({ id: `smart-result:${n}`, targetKey: String(n), label: String(n) }));
    }

    function buildSmartQueue(params, roundSeed) {
      const { tasks, targets, assignment } = buildSmartPool(params);
      const rng = createRng(`smartArithmetic|round|${roundSeed}|${JSON.stringify(params)}`);
      const families = params.smartFamily === 'mixed' ? SMART_FAMILIES : [params.smartFamily];
      const groups = new Map(families.map(f => [f, rng.shuffle(targets.filter(n => assignment.get(n) === f))]));
      const queue = [];
      while (queue.length < targets.length) for (const family of rng.shuffle(families)) {
        const result = groups.get(family).pop();
        if (result === undefined) continue;
        const task = rng.choice(tasks.filter(t => t.subtype === family && t.targetKey === String(result)));
        queue.push({ ...task, acceptedTargetKeys: [String(result)], timestamp: null });
      }
      return queue;
    }
