      if (parts.length !== (isFree ? 8 : 6) || parts.some(part => !part)) throw new Error('Der Satzcode ist unvollständig oder enthält zusätzliche Abschnitte.');
      const checksum = parts[parts.length - 1];
      if (checksum !== codeChecksum(parts.slice(0, -1).join('.'))) throw new Error('Die Prüfsumme stimmt nicht. Bitte den Satzcode mit dem Original vergleichen oder erneut kopieren. Es wurde kein anderer Satz geladen.');
      const fingerprintText = parts[parts.length - 2];
      const fingerprintBytes = decodeCodeBytes(fingerprintText);
      if (fingerprintBytes.length !== 12) throw new Error('Die Satzkennung im Code ist unvollständig.');
      let config;
      if (isFree) {
        const mode = CODE_MODE[parts[3]];
        const params = unpackCodeParams(mode, parts[4]);
        const seedBytes = decodeCodeBytes(parts[5]);
        if (seedBytes.length > 128) throw new Error('Der Kartenseed im Code ist zu lang.');
        let cardSeed;
        try { cardSeed = decodeURIComponent(escape(String.fromCharCode(...seedBytes))); } catch { throw new Error('Der Kartenseed ist kein gültiger UTF-8-Text.'); }
        validateCardSeed(cardSeed);
        config = { mode, params, cardSeed };
      } else {
        const preset = EZ_PRESETS.find(item => item.id.replace(/-/g, '').toUpperCase() === parts[3]);
        if (!preset) throw new Error('Diese Vorlage existiert nicht. Es wurde keine Ersatzvorlage geladen.');
        config = { mode: preset.mode, params: preset.params, cardSeed: preset.cardSeed };
      }
      const prepared = createCardSet(config);
      if (encodeCodeBytes(hexCodeBytes(prepared.fingerprint)) !== fingerprintText) throw new Error('Satzkennung stimmt nicht mit den erzeugten Karten überein. Generator oder Vorlage haben sich geändert, oder der Code ist beschädigt. Bitte die passende App-Version verwenden; die laufende Runde bleibt erhalten.');
      return { ...prepared, code: formatSetCode(parts), displayCode: formatSetCode(parts), codeKind: isFree ? 'free' : 'preset' };
    }

    function validateSetFileSettings(data, cardSet) {
      const ruleKeys = ['rows', 'cols', 'diags', 'corners', 'fullHouse'];
      if (!data.rules || typeof data.rules !== 'object' || Array.isArray(data.rules) || Object.keys(data.rules).length !== ruleKeys.length || ruleKeys.some(key => typeof data.rules[key] !== 'boolean')) throw new Error('Die Satzdatei enthält ungültige Spielregeln.');
      if (!Number.isSafeInteger(data.threshold)) throw new Error('Die Satzdatei enthält eine ungültige Siegschwelle.');
      const ruleError = getRulesError(data.rules, cardSet.params.grid, data.threshold);
      if (ruleError) throw new Error(ruleError);
      const ids = data.activeCardIds;
      if (!Array.isArray(ids) || !ids.length || ids.length > cardSet.cards.length || new Set(ids).size !== ids.length || ids.some(id => !Number.isSafeInteger(id) || !cardSet.cards.some(card => card.id === id))) throw new Error('Die Satzdatei enthält eine ungültige Kartenauswahl.');
    }

    function serializeSetFile({ cardSet, rules, threshold, activeCardIds }) {
      if (!cardSet) throw new Error('Zuerst einen Kartensatz laden.');
      const data = { format: 'MATHE-BINGO-SATZ', version: 1, code: cardSet.longCode, rules, threshold, activeCardIds: Array.from(activeCardIds) };
      validateSetFileSettings(data, cardSet);
      return JSON.stringify(data, null, 2);
    }

    function parseSetFile(text) {
      if (typeof text !== 'string' || text.length > 32768) throw new Error('Die Satzdatei ist zu groß oder nicht lesbar.');
      let data;
      try { data = JSON.parse(text); } catch { throw new Error('Dies ist keine gültige Bingo-Satzdatei. Bitte die .bingo.json-Datei wählen, kein PDF.'); }
      const keys = ['format', 'version', 'code', 'rules', 'threshold', 'activeCardIds'];
      if (!data || typeof data !== 'object' || Array.isArray(data) || Object.keys(data).length !== keys.length || keys.some(key => !Object.prototype.hasOwnProperty.call(data, key)) || data.format !== 'MATHE-BINGO-SATZ' || data.version !== 1 || typeof data.code !== 'string') throw new Error('Unbekanntes Satzdateiformat oder unbekannte Version. Der bisherige Satz bleibt erhalten.');
      const prepared = parseGameCode(data.code);
      validateSetFileSettings(data, prepared);
      return { ...prepared, recommendedRules: { rules: { ...data.rules }, threshold: data.threshold }, importedActiveCardIds: [...data.activeCardIds] };
    }

      return Object.entries(GAME_MODES).filter(([, def]) => !def.hidden);
    }

    function getPresetById(id) {
      return EZ_PRESETS.find(preset => preset.id === id) || EZ_PRESETS[0];
    }

    function poolRepairHint(mode, params, available, cells) {
      if (mode !== 'linearEquations') return '';
      const minSolution = Math.min(params.eqMin, params.eqMax);
      const visibleMin = params.eqAllowNegative ? minSolution : Math.max(0, minSolution);
      const neededMax = visibleMin + cells - 1;
      const parts = [
        `Kartenfelder sind hier Lösungen, nicht einzelne Gleichungen.`,
        `Mit den aktuellen Einstellungen entstehen nur ${available} verschiedene Lösungsfelder.`
      ];
      if (!params.eqAllowNegative && minSolution < 0) parts.push('Negative Lösungen sind deaktiviert; dadurch zählen nur Lösungen ab 0.');
      parts.push(`Mögliche Reparatur: Lösung max. mindestens ${neededMax} setzen, negative Lösungen aktivieren oder ein kleineres Raster wählen.`);
      return ` ${parts.join(' ')}`;
    }

    function validatePools(mode, params) {
      const modeDef = GAME_MODES[mode];
      if (mode === 'smartArithmetic' && params.grid > 5) throw new Error('Für Schlau rechnen bitte ein Raster von 2×2 bis 5×5 wählen. Der bisherige Satz bleibt erhalten.');
      const diagramCards = mode === 'geometry2d' && params.geometryTaskType === 'formulaToFigure' || mode === 'linearFunctions' && params.linearFunctionTaskType === 'formulaToGraph' || mode === 'vertexForm' && params.vertexTaskType === 'formulaToGraph';
      if (diagramCards && params.grid > 3) throw new Error('Für lesbare Graphen- und Figurenkarten bitte höchstens ein 3×3-Raster wählen. Der bisherige Satz bleibt erhalten.');
      if (mode === 'linearEquations' && params.eqType === 'negative' && !params.eqAllowNegativeNumbers && (!params.eqAllowNegative || Math.min(params.eqMin, params.eqMax) >= 0)) {
        throw new Error('Der Typ „negative Zahlen“ benötigt negative Ausgangswerte oder erlaubte negative Lösungen mit Lösung min. unter 0. Bitte die Vorzeichenoptionen oder den Lösungsbereich ändern.');
      }
      const rawTasks = modeDef.buildTaskPool(params);
      const tasks = uniqBy(rawTasks, t => t.id);
      const cardPool = uniqBy(modeDef.buildCardPool(params), e => e.targetKey);
      if (!tasks.length) throw new Error('Der Aufgabenpool ist leer. Bitte Einstellungen prüfen.');
      if (!cardPool.length) throw new Error('Der Kartenpool ist leer. Bitte Einstellungen prüfen.');
      const cells = params.grid * params.grid;
      if (cardPool.length < cells) {
        throw new Error(`Zu wenige verschiedene Kartenfelder für ein ${params.grid}×${params.grid}-Raster. Benötigt: ${cells}, verfügbar: ${cardPool.length}.${poolRepairHint(mode, params, cardPool.length, cells)}`);
      }
      return {
        tasks,
        cardPool,
        stats: {
          totalTasks: tasks.length,
          duplicateTasksRemoved: rawTasks.length - tasks.length,
          uniqueTargets: cardPool.length,
          approxCards: estimateCombinations(cardPool.length, cells)
        }
      };
    }

    function generateCards({ mode, params, cardSeed }) {
      const stableParams = canonicalParamsForMode(mode, params);
      const { cardPool } = validatePools(mode, stableParams);
      const rng = createRng(`${mode}|cards|${cardSeed}|${JSON.stringify(stableParams)}`);
      const cells = stableParams.grid * stableParams.grid;
      const signatures = new Set();
      const cards = [];
      const maxAttempts = Math.max(8000, params.cards * 800);
      let attempts = 0;
      while (cards.length < params.cards && attempts < maxAttempts) {
        attempts++;
        const entries = rng.shuffle(cardPool).slice(0, cells);
        const signature = entries.map(e => e.targetKey).sort().join('|');
        if (!signatures.has(signature)) {
          signatures.add(signature);
          cards.push({ id: cards.length + 1, entries });
        }
      }
      if (cards.length < params.cards) throw new Error('Nicht genügend unterschiedliche Karten möglich. Bitte n, Raster oder Kartenanzahl anpassen.');
      return cards;
    }

    // G2: algebraic equality is admitted within the visibly requested term form.
    // Fractions keep their requested representation; units remain distinct.
    function semanticTermKey(targetKey) {
      const tokens = String(targetKey).split(':');
      let parts;
      if (tokens[0] === 'factor') {
        const [, a, inner, v, b] = tokens;
        parts = [[v, Number(a) * Number(inner)], ['', Number(a) * Number(b)]];
      } else if (tokens[0] === 'factorPower') {
        const [, a, v, b] = tokens;
        parts = [[`${v}^2`, Number(a)], [v, Number(a) * Number(b)]];
      } else if (tokens[0] === 'factorPoly') {
        const [, a, v, b] = tokens;
        parts = [[`${v}^2`, Number(a)], [v, Number(a)], ['', Number(a) * Number(b)]];
      } else {
        parts = String(targetKey) === '0' ? [] : String(targetKey).split('|').map(part => { const i = part.lastIndexOf(':'); return [part.slice(0, i), Number(part.slice(i + 1))]; });
      }
      const coefficients = new Map();
      for (const [term, coefficient] of parts) {
        const powers = new Map();
        for (const match of term.matchAll(/([a-z])(?:\^(\d+))?/g)) powers.set(match[1], (powers.get(match[1]) || 0) + Number(match[2] || 1));
        const monomial = [...powers].sort(([a], [b]) => a.localeCompare(b)).map(([v, power]) => `${v}^${power}`).join('*');
        coefficients.set(monomial, (coefficients.get(monomial) || 0) + coefficient);
      }
      return JSON.stringify([...coefficients].filter(([, c]) => c !== 0).sort(([a], [b]) => a.localeCompare(b)));
    }

    function answerIdentity(task, mode) {
      if (mode === 'simplifyTerms') return `${task.subtype === 'factor' ? 'factored' : 'expanded'}:${semanticTermKey(task.targetKey)}`;
      if (mode === 'geometry2d' && task.subtype === 'formulaToFigure') return `figure-for:${task.label}`;
      if (mode === 'geometry2d' || mode === 'geometry3d') return `text:${task.targetLabel}`;
      // Existing numeric/graph targets already encode exact form, variable and unit.
      return task.targetKey;
    }

    function getDrawnKeys(history) {
      return new Set(history.flatMap(task => task.acceptedTargetKeys || [task.targetKey]));
    }

    function buildDrawQueue({ mode, params, roundSeed }) {
      const modeDef = GAME_MODES[mode];
      const stableParams = canonicalParamsForMode(mode, params);
      const { tasks } = validatePools(mode, stableParams);
      if (mode === 'smartArithmetic') return buildSmartQueue(stableParams, roundSeed);
      const rng = createRng(`${mode}|round|${roundSeed}|${JSON.stringify(stableParams)}`);
      const byAnswer = new Map();
      tasks.forEach(task => {
        const identity = answerIdentity(task, mode);
        if (!byAnswer.has(identity)) byAnswer.set(identity, new Set());
        byAnswer.get(identity).add(task.targetKey);
      });
      const byTarget = new Map();
      tasks.forEach(task => {
        if (!byTarget.has(task.targetKey)) byTarget.set(task.targetKey, []);
        byTarget.get(task.targetKey).push(task);
      });
      const keys = rng.shuffle(Array.from(byTarget.keys()).sort());
      return keys.map(targetKey => {
        const base = rng.choice(byTarget.get(targetKey));
        const prepared = modeDef.prepareTask(base, stableParams, rng);
        return { ...prepared, targetKey, acceptedTargetKeys: [...byAnswer.get(answerIdentity(base, mode))], timestamp: null };
      });
    }

    function getSolutionLabel(task, mode) {
      if (!task) return '';
      if (task.targetLabel) return task.targetLabel;
      if (mode === 'fractions' && task.targetKey?.includes('/')) {
        const [num, den] = task.targetKey.split('/').map(Number);
        return formatFractionText({ num, den });
      }
      if (mode === 'linearFunctions' && task.targetKey?.startsWith('y:')) return task.targetKey.slice(2);
      return String(task.targetKey || '');
    }

    function getBingoPatterns(rules, size) {
      const patterns = [];
      if (rules.rows) for (let r = 0; r < size; r++) patterns.push({ name: `Zeile ${r + 1}`, indices: Array.from({ length: size }, (_, c) => r * size + c) });
      if (rules.cols) for (let c = 0; c < size; c++) patterns.push({ name: `Spalte ${c + 1}`, indices: Array.from({ length: size }, (_, r) => r * size + c) });
      if (rules.diags) {
        patterns.push({ name: 'Diagonale ↘', indices: Array.from({ length: size }, (_, i) => i * size + i) });
        patterns.push({ name: 'Diagonale ↙', indices: Array.from({ length: size }, (_, i) => i * size + size - 1 - i) });
      }
      if (rules.corners) patterns.push({ name: 'Vier Ecken', indices: [0, size - 1, size * (size - 1), size * size - 1] });
      if (rules.fullHouse) patterns.push({ name: 'Ganze Karte', indices: Array.from({ length: size * size }, (_, i) => i) });
      return patterns;
    }

    function countBingoPatterns(card, drawnKeys, rules, size) {
      return getBingoPatterns(rules, size).filter(p => p.indices.every(i => drawnKeys.has(card.entries[i]?.targetKey))).length;
    }

    function getRulesError(rules, size, threshold) {
      const max = getBingoPatterns(rules, size).length;
      if (!max) return 'Wähle mindestens eine Bingo-Regel.';
      if (!Number.isSafeInteger(Number(threshold)) || Number(threshold) < 1 || Number(threshold) > max) return `Für diese Regeln sind 1 bis ${max} Muster als Siegschwelle möglich.`;
      return '';
    }

    function evaluateCard({ cardNumber, cards, activeCardIds, drawnKeys, rules, size, threshold }) {
      const raw = String(cardNumber ?? '').trim();
      const result = { valid: false, cardNo: null, card: null, marked: [], patterns: [], count: 0, canAward: false, status: 'invalid' };
      if (!raw) return { ...result, message: 'Bitte eine Kartennummer eingeben. Satzkennung mit der Papierkarte abgleichen.' };
      if (!/^\d+$/.test(raw) || !Number.isSafeInteger(Number(raw)) || Number(raw) < 1) return { ...result, message: 'Die Kartennummer muss eine sichere ganze Zahl ab 1 sein; keine Vorzeichen oder Dezimalzahlen.' };
      const cardNo = Number(raw);
      const card = cards.find(c => c.id === cardNo);
      if (!card) return { ...result, cardNo, message: `Karte #${cardNo} gehört nicht zum geladenen Satz (Nummern 1–${cards.length}). Bei fremden Karten bitte die Satzkennung prüfen.` };
      const marked = card.entries.map(e => drawnKeys.has(e.targetKey));
      const patterns = getBingoPatterns(rules, size).filter(p => p.indices.every(i => marked[i]));
      const count = patterns.length;
      const base = { ...result, valid: true, cardNo, card, marked, patterns, count };
      if (!activeCardIds.has(cardNo)) return { ...base, status: 'inactive', message: `Karte #${cardNo} ist nicht aktiv/ausgeteilt und kann nicht gewertet werden.` };
      const ruleError = getRulesError(rules, size, threshold);
      if (ruleError) return { ...base, status: 'rules', message: ruleError };
      if (!count) return { ...base, status: 'none', message: `Karte #${cardNo}: Noch kein Bingo (0/${threshold} Muster).` };
      if (count < Number(threshold)) return { ...base, status: 'bingo', message: `Karte #${cardNo}: Bingo, aber noch kein Sieg (${count}/${threshold} Muster).` };
      return { ...base, status: 'eligible', canAward: true, message: `Karte #${cardNo}: rechnerisch siegfähig (${count}/${threshold} Muster).` };
    }

    function getBingoSortAge(card, history, rules, size, currentCount) {
      if (!currentCount) return Number.MAX_SAFE_INTEGER;
      for (let age = 1; age <= history.length; age++) {
        const olderKeys = getDrawnKeys(history.slice(age));
        if (countBingoPatterns(card, olderKeys, rules, size) < currentCount) return age;
      }
      return Number.MAX_SAFE_INTEGER;
    }

    function sortBingoRows(rows) {
      return [...rows].sort((a, b) => a.sortAge - b.sortAge || b.count - a.count || b.cardId - a.cardId);
    }

    function summarizeCards(cards, limit = 20) {
      if (!cards.length) return 'keine';
      const sorted = [...cards];
      const first = sorted.slice(0, limit).map(id => `#${id}`).join(', ');
      const rest = sorted.length - limit;
      return rest > 0 ? `${first} (+${rest} weitere)` : first;
    }

    function summarizeBingoRows(rows, { showAdded = false, limit = 20 } = {}) {
      if (!rows.length) return 'keine';
      const sorted = sortBingoRows(rows);
      const first = sorted.slice(0, limit).map(row => {
        const added = showAdded && row.added ? `, +${row.added} neu` : '';
        return `#${row.cardId} (${row.count}${added})`;
      }).join(', ');
      const rest = sorted.length - limit;
      return rest > 0 ? `${first} (+${rest} weitere)` : first;
    }

    function formatRuleList(rules) {
      const labels = [];
      if (rules.rows) labels.push('Zeilen');
      if (rules.cols) labels.push('Spalten');
      if (rules.diags) labels.push('Diagonalen');
      if (rules.corners) labels.push('vier Ecken');
      if (rules.fullHouse) labels.push('ganze Karte');
      return labels.length ? labels.join(', ') : 'keine Regeln aktiv';
    }

    function Fraction({ num, den, mixed = false, forceFraction = false, className = '' }) {
      if (den === 1 && !forceFraction) return <span className={`inline-flex items-center leading-none ${className}`}>{num}</span>;
      const mixedParts = mixed ? splitMixedFraction(num, den) : { whole: 0, num, den };
      if (mixedParts.whole && mixedParts.num) {
        return <span className={`inline-flex items-center gap-1 leading-none ${className}`}><span>{mixedParts.whole}</span><Fraction num={mixedParts.num} den={mixedParts.den} /></span>;
      }
      if (mixedParts.whole && !mixedParts.num) return <span className={`inline-flex items-center leading-none ${className}`}>{mixedParts.whole}</span>;
      return (
        <span className={`inline-flex flex-col items-center leading-none ${className}`} style={{ verticalAlign: 'middle' }}>
          <span className="border-b-[0.1em] border-current px-1 pb-[0.1em] leading-tight">{mixedParts.num}</span>
          <span className="px-1 pt-[0.1em] leading-tight">{mixedParts.den}</span>
        </span>
      );
    }

    function RootExpression({ radicand }) {
      return (
        <span className="root-expression" aria-label={`Wurzel aus ${radicand}`}>
          <span className="root-symbol">√</span>
          <span className="root-radicand">{radicand}</span>
        </span>
      );
    }

    function graphYValue(item, x) {
      return item.graphType === 'quadratic'
        ? item.a * Math.pow(x - item.b, 2) + item.c
        : item.m * x + item.b;
    }

    function expandAxisForPoint(bounds, axis, value) {
      if (!Number.isFinite(value) || value === 0) return;
      const minKey = axis === 'x' ? 'xMin' : 'yMin';
      const maxKey = axis === 'x' ? 'xMax' : 'yMax';
      if (value > 0) bounds[maxKey] = Math.max(bounds[maxKey], Math.ceil(value) + 1);
      if (value < 0) bounds[minKey] = Math.min(bounds[minKey], Math.floor(value) - 1);
    }

    // A single finite plot model drives SVG and exported PDF, including scale.
    function graphPoints(item) {
      // Step towards the x-axis so both integer reference points fit the shared
      // range without enlarging the viewport for individual lines.
      const direction = item.b * item.m > 0 ? -1 : 1;
      return item.graphType === 'linear' ? [[0, item.b], [direction, item.m * direction + item.b]] : [[item.b, item.c], [item.b + 1, item.c + item.a]];
    }

    function getGraphBounds(item, params = {}) {
      if (item.graphType === 'linear') {
        // The complete configured pool, never the current line, sets the range.
        const extent = Math.max(clampNumber(params.linearFunctionBMax, 0, 30, 30), clampNumber(params.linearFunctionSlopeMax, 1, 12, 12)) + 1;
        return { xMin: -extent, xMax: extent, yMin: -extent, yMax: extent };
      }
      const range = clampNumber(params.vertexRange ?? params.n, 2, 20, 20);
      const coeffMax = clampNumber(params.vertexCoeffMax, 1, 8, 8);
      const zeros = params.vertexTaskType === 'zeros' || item.subtype === 'zeros';
      const zeroRadius = Math.max(1, Math.min(3, Math.floor(range / 2)));
      const extent = zeros ? Math.max(range + 1, coeffMax * zeroRadius * zeroRadius) + 1 : range + coeffMax + 1;
      return { xMin: -extent, xMax: extent, yMin: -extent, yMax: extent };
    }

    function integerTicks(min, max, step = 1) {
      const first = Math.ceil(min / step) * step;
      return Array.from({ length: Math.max(0, Math.floor((max - first) / step) + 1) }, (_, i) => first + i * step);
    }

    function graphTickStep(span, maxTicks) {
      const wanted = span / maxTicks;
      const power = 10 ** Math.floor(Math.log10(Math.max(1, wanted)));
      return [1, 2, 5, 10].map(n => n * power).find(n => n >= wanted) || power * 10;
    }

    function graphLayout(item, width, height, params) {
      const bounds = getGraphBounds(item, params);
      let left = width * 0.13, right = width * 0.93, top = height * 0.18, bottom = height * 0.82;
      // Every function graph uses a square unit grid and one range per set.
      // Only number labels may be sparser for large freely chosen ranges.
      top = height * 94 / 520; bottom = height * 496 / 520;
      const centerY = (top + bottom) / 2;
      const unit = Math.min((right - left) / (bounds.xMax - bounds.xMin), (bottom - top) / (bounds.yMax - bounds.yMin));
      const xHalf = bounds.xMax, yHalf = bounds.yMax;
      left = width / 2 - xHalf * unit; right = width / 2 + xHalf * unit;
      top = centerY - yHalf * unit; bottom = centerY + yHalf * unit;
      const xStep = 1, yStep = 1;
      const xLabelStep = graphTickStep(bounds.xMax - bounds.xMin, (right - left) / 28);
      const yLabelStep = graphTickStep(bounds.yMax - bounds.yMin, (bottom - top) / 28);
      const sx = x => left + (x - bounds.xMin) / (bounds.xMax - bounds.xMin) * (right - left);
      const sy = y => bottom - (y - bounds.yMin) / (bounds.yMax - bounds.yMin) * (bottom - top);
      const segments = []; let segment = [];
      // Include every sample in one shared clipped path; never bridge hidden parts.
      for (let i = 0; i <= 600; i++) {
        const x = bounds.xMin + (bounds.xMax - bounds.xMin) * i / 600, y = graphYValue(item, x);
        if (y >= bounds.yMin && y <= bounds.yMax) segment.push([sx(x), sy(y)]);
        else if (segment.length) { segments.push(segment); segment = []; }
      }
      if (segment.length) segments.push(segment);
      return { bounds, left, right, top, bottom, sx, sy, xStep, yStep, xLabelStep, yLabelStep,
        xTicks: integerTicks(bounds.xMin, bounds.xMax, xStep), yTicks: integerTicks(bounds.yMin, bounds.yMax, yStep),
        xLabels: integerTicks(bounds.xMin, bounds.xMax, xLabelStep), yLabels: integerTicks(bounds.yMin, bounds.yMax, yLabelStep),
        segments, points: graphPoints(item) };
    }

    function graphInstruction(item) {
      if (item.subtype === 'zeros') return 'Lies die Nullstelle(n) ab.';
      return item.graphType === 'quadratic' ? 'Bestimme die Scheitelpunktform.' : 'Bestimme die Funktionsgleichung.';
    }

    // Shared textbook-style labels and arrowheads for screen and PDF.
    function graphAxisModel(item, g) {
      const x0 = g.sx(0), y0 = g.sy(0);
      return {
        color: '#111827',
        xLabels: g.xLabels.filter(v => v !== 0).map(v => [v, g.sx(v), y0 + 20]),
        yLabels: g.yLabels.filter(v => v !== 0).map(v => [v, x0 - 7, g.sy(v) + 4]),
        xName: [g.right + 25, y0 + 18],
        yName: [x0 - 15, g.top - 10],
        arrows: [
          [[g.right + 13, y0], [g.right, y0 - 5], [g.right, y0 + 5]],
          [[x0, g.top - 13], [x0 - 5, g.top], [x0 + 5, g.top]]
        ]
      };
    }

    function FunctionGraph({ item, small = false, params }) {
      const width = 520, height = 520;
      const g = graphLayout(item, width, height, params), { sx, sy } = g;
      const visibleHeight = 512;
      const axes = graphAxisModel(item, g);
      const text = (x, y, label, anchor = 'middle', size = 19) => <text x={x} y={y} textAnchor={anchor} fontSize={size} fontWeight="600" fill="#0f172a">{label}</text>;
      return <svg width={width} height={visibleHeight} style={{width:small ? '100%' : undefined,height:'auto'}} viewBox={`0 0 ${width} ${visibleHeight}`} role="img" aria-label="Funktionsgraph mit beschrifteten Achsen und Skalen" className="inline-block max-w-full rounded-xl bg-white/95 text-slate-800 shadow-sm">
        {!small && text(width/2, 28, graphInstruction(item), 'middle', 22)}
        {text(width/2, 57, `Markierte Punkte: ${g.points.map(([x,y]) => `(${x}|${y})`).join('; ')}`, 'middle', small ? 22 : 19)}
        {g.xTicks.map(v => <line key={`gx${v}`} x1={sx(v)} x2={sx(v)} y1={g.top} y2={g.bottom} stroke="#e2e8f0" strokeWidth="1" />)}
        {g.yTicks.map(v => <line key={`gy${v}`} x1={g.left} x2={g.right} y1={sy(v)} y2={sy(v)} stroke="#e2e8f0" strokeWidth="1" />)}
        <line x1={g.left} x2={g.right} y1={sy(0)} y2={sy(0)} stroke={axes.color} strokeWidth="2" />
        <line x1={sx(0)} x2={sx(0)} y1={g.top} y2={g.bottom} stroke={axes.color} strokeWidth="2" />
        {g.xTicks.map(v => { const label = axes.xLabels.find(([value]) => value === v); return <React.Fragment key={`tx${v}`}><line x1={sx(v)} x2={sx(v)} y1={sy(0)-4} y2={sy(0)+4} stroke={axes.color} />{label && text(label[1], label[2], v, 'middle', 14)}</React.Fragment>; })}
        {g.yTicks.map(v => { const label = axes.yLabels.find(([value]) => value === v); return <React.Fragment key={`ty${v}`}><line x1={sx(0)-4} x2={sx(0)+4} y1={sy(v)} y2={sy(v)} stroke={axes.color} />{label && text(label[1], label[2], v, 'end', 14)}</React.Fragment>; })}
        {axes.arrows.map((points,i) => <polygon key={`arrow${i}`} points={points.map(p=>p.join(',')).join(' ')} fill={axes.color} />)}
        {text(...axes.xName, 'x')}{text(...axes.yName, 'y')}
        {g.segments.map((segment,i) => <polyline key={i} points={segment.map(p=>p.join(',')).join(' ')} fill="none" stroke="#4f46e5" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />)}
        {g.points.map(([x,y],i) => <path key={i} d={`M ${sx(x)-4} ${sy(y)-4} L ${sx(x)+4} ${sy(y)+4} M ${sx(x)-4} ${sy(y)+4} L ${sx(x)+4} ${sy(y)-4}`} fill="none" stroke="#000000" strokeWidth="2" strokeLinecap="round" />)}
      </svg>;
    }

    // Schematic figures: labels encode the exact model, pixel lengths are not data.
    // Shared primitives also drive PDF, avoiding a second set of geometry semantics.
    function geometryFigureModel(item) {
      const perimeter = item.measure === 'perimeter';
      const val = key => item.values?.[key] != null ? `${key}=${item.values[key]}` : key;
      const model = { polygons: [], lines: [], circles: [], texts: [] };
      const poly = points => model.polygons.push(points);
      const line = (a,b) => model.lines.push([a,b]);
      const text = (x,y,t) => model.texts.push([x,y,t]);
      const rightAngle = (x,y) => { line([x,y-12],[x+12,y-12]); line([x+12,y-12],[x+12,y]); };
      text(260,24,`${item.shapeLabel} · ${perimeter ? 'Umfang U' : 'Flächeninhalt A'}`);
      text(260,344,`schematisch · ${item.labelMode === 'numbers' ? 'Längen in cm' : 'Buchstaben: Formel gesucht'}`);
      switch (item.shapeKey) {
        case 'square': poly([[170,75],[350,75],[350,255],[170,255]]); text(260,282,val('a')); break;
        case 'rectangle': poly([[130,105],[390,105],[390,245],[130,245]]); text(260,276,val('a')); text(85,180,val('b')); break;
        case 'triangle':
          poly([[120,260],[400,260],[260,75]]);
          if(perimeter) { text(260,290,val('c'));text(152,165,val('a'));text(375,165,val('b')); }
          else { line([260,75],[260,260]);rightAngle(260,260);text(300,185,val('h'));text(260,290,val('g')); }
          break;
        case 'parallelogram':
          poly([[120,260],[365,260],[425,100],[180,100]]);
          text(260,291,val(perimeter ? 'a' : 'g'));
          if(perimeter) text(427,188,val('b')); else { line([180,100],[180,260]);rightAngle(180,260);text(224,192,val('h')); } break;
        case 'trapezoid':
          poly([[110,260],[410,260],[345,100],[175,100]]);text(260,290,val('a'));text(260,80,val('c'));
          if(perimeter) {text(110,180,val('d'));text(410,180,val('b'));} else {line([175,100],[175,260]);rightAngle(175,260);text(218,190,val('h'));} break;
        case 'rhombus':
          poly([[260,65],[420,180],[260,295],[100,180]]);
          if(perimeter) text(365,105,val('a')); else {line([100,180],[420,180]);line([260,65],[260,295]);rightAngle(260,180);text(184,164,val('e'));text(305,238,val('f'));} break;
        case 'circle': model.circles.push([260,185,100]);line([260,185],[360,185]);text(312,165,val('r')); break;
      }
      return model;
    }

    function GeometryFigure({ item, small = false }) {
      const m = geometryFigureModel(item);
      return <svg width={520} height={360} style={{width:small ? '100%' : undefined,height:'auto'}} viewBox="0 0 520 360" role="img" aria-label={`${item.shapeLabel}, schematische Zeichnung`} className="inline-block max-w-full rounded-xl bg-white/95 text-slate-800 shadow-sm">
        {m.polygons.map((p,i)=><polygon key={`p${i}`} points={p.map(q=>q.join(',')).join(' ')} fill="#eef6ff" stroke="#334155" strokeWidth="3" strokeLinejoin="round" />)}
        {m.circles.map(([x,y,r],i)=><circle key={`c${i}`} cx={x} cy={y} r={r} fill="#eef6ff" stroke="#334155" strokeWidth="3" />)}
        {m.lines.map(([a,b],i)=><line key={`l${i}`} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="#4f46e5" strokeWidth="2" />)}
        {m.texts.map(([x,y,t],i)=><text key={`t${i}`} x={x} y={y} textAnchor="middle" fontSize={i<2 ? 18 : 23} fontWeight="700" fill="#0f172a">{t}</text>)}
      </svg>;
    }

    function GeometryTask({ item }) {
      if(item.kind !== 'geometryFigure') return <span className="whitespace-pre-line" style={{fontSize:'0.55em',lineHeight:1.2}}>{item.label}</span>;
      const instruction = item.labelMode === 'letters' ? 'Gib die passende Formel an.' : item.answerMode === 'resultOnly' ? 'Berechne das Ergebnis mit Einheit.' : 'Gib die passende Zahlenrechnung und das Ergebnis mit Einheit an.';
      return <span className="inline-flex max-w-full flex-col items-center gap-2"><GeometryFigure item={item} /><span className="whitespace-normal" style={{fontSize:'0.3em',lineHeight:1.2,maxWidth:'32em'}}>{instruction}</span></span>;
    }

    function SolidTask({ item }) {
      const lines = item.label.split('\n');
      return <span className="inline-flex max-w-full flex-col items-center gap-3 whitespace-normal" style={{fontSize:'0.42em',lineHeight:1.25}}>{lines.map((line,i)=><span key={i} style={{maxWidth:'30em'}}>{line}</span>)}</span>;
    }

    function FunctionTask({ item, params }) {
      if(item.kind === 'graph') return <FunctionGraph item={item} params={params} />;
      const instruction = item.graphType === 'quadratic' ? (item.subtype === 'formulaToGraph' ? 'Ordne den passenden Graphen zu.' : 'Bestimme den Scheitelpunkt.') : item.subtype === 'formulaToGraph' ? 'Ordne den passenden Graphen zu.' : item.subtype === 'yValue' ? 'Berechne den Funktionswert y.' : item.subtype === 'xValue' ? 'Bestimme die Stelle x.' : 'Bestimme die Nullstelle.';
      return <span className="inline-flex flex-col items-center gap-3"><span style={{fontSize:'0.35em'}}>{instruction}</span><span className="whitespace-pre-line">{item.label}</span></span>;
    }

    function PythagorasFigure({ item, small = false }) {
      const width = small ? 190 : 560;
      const height = small ? 150 : 360;
      const f = small ? 0.72 : 1;
      const labels = item.labels || { legA: 'a', legB: 'b', hyp: 'c' };
      const sideValue = key => {
        if (item.missing === key) return '?';
        if (key === 'legA') return item.triple.a;
        if (key === 'legB') return item.triple.b;
        return item.triple.c;
      };
      const textSize = small ? 11 : 25;
      const labelText = (x, y, content, anchor = 'middle') => <text x={x} y={y} textAnchor={anchor} fontSize={textSize} fontWeight="900" fill="#0f172a">{content}</text>;
      return (
        <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="inline-block max-w-full rounded-xl bg-white/95 text-slate-800 shadow-sm">
          <text x={width / 2} y={small ? 14 : 32} textAnchor="middle" fontSize={small ? 10 : 21} fontWeight="900" fill="#475569">rechtwinklig · schematisch · Längen in cm</text>
          <polygon points={`${width * 0.22},${height * 0.76} ${width * 0.78},${height * 0.76} ${width * 0.22},${height * 0.24}`} fill="#eef6ff" stroke="#334155" strokeWidth={small ? 2 : 4} strokeLinejoin="round" />
          <path d={`M ${width * 0.22} ${height * 0.68} L ${width * 0.30} ${height * 0.68} L ${width * 0.30} ${height * 0.76}`} fill="none" stroke="#64748b" strokeWidth={small ? 1.4 : 3} />
          {labelText(width * 0.5, height * 0.76 + 28 * f, `${labels.legA} = ${sideValue('legA')}`)}
          {labelText(width * 0.18, height * 0.52, `${labels.legB} = ${sideValue('legB')}`, 'end')}
          {labelText(width * 0.56, height * 0.44, `${labels.hyp} = ${sideValue('hyp')}`)}
        </svg>
      );
    }

    function renderCardEntry(entry, mode, className = '', params) {
      if (entry.kind === 'fraction') return <Fraction num={entry.num} den={entry.den} mixed={entry.mixed} className={className} />;
      if (entry.kind === 'graph') return <FunctionGraph item={entry} small params={params} />;
      if (entry.kind === 'geometryFigure') return <GeometryFigure item={entry} small />;
      return <span className={className}>{entry.label}</span>;
    }

    function BingoCard({ card, size, mode, params }) {
      return (
        <div className={`rounded-3xl border border-slate-200 bg-white p-4 shadow-sm ${size > 4 || card.entries.some(entry => ['graph','geometryFigure'].includes(entry.kind)) ? 'md:col-span-2 xl:col-span-3' : ''}`}>
          <div className="mb-3 flex items-start justify-between gap-3">
            <div>
              <div className="text-xs uppercase tracking-[0.25em] text-indigo-500 font-bold">Bingo</div>
              <div className="text-lg font-bold text-slate-800">Karte #{card.id}</div>
              <div className="mt-1 text-xs text-slate-500">{GAME_MODES[mode].label} · {size}×{size}</div>
            </div>
          </div>
          <div className="bingo-preview" style={{ gridTemplateColumns: `repeat(${size}, minmax(0, 1fr))` }}>
            {card.entries.map((entry, idx) => (
              <div key={`${card.id}-${idx}-${entry.targetKey}`} className="bingo-cell rounded-2xl bg-white p-2 flex items-center justify-center text-center border border-slate-200">
                {renderCardEntry(entry, mode, 'text-[clamp(0.64rem,1.15vw,0.92rem)] leading-tight font-semibold text-slate-700 break-words', params)}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function NumberInput({ label, value, setValue, min = 1, max = 999 }) {
      return (
        <label className="block">
          <span className="mb-2 block text-sm font-semibold text-slate-600">{label}</span>
          <input type="number" value={value} min={min} max={max} onChange={e => setValue(e.target.value)}
            className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" />
        </label>
      );
    }

    // S6b: local points are optional; malformed data must never reach React.
    function isStoredScoreboard(value) {
      if (!Array.isArray(value)) return false;
      return value.every(row => row && typeof row === 'object' && !Array.isArray(row) &&
        typeof row.name === 'string' && row.name.trim().length > 0 &&
        Number.isSafeInteger(row.points) && row.points >= 0 && Array.isArray(row.wins) &&
        row.wins.every(win => win && typeof win === 'object' && !Array.isArray(win) &&
          Number.isSafeInteger(win.card) && win.card >= 1 &&
          ['seed', 'time', 'setCode', 'roundId'].every(key => win[key] === undefined || win[key] === null || typeof win[key] === 'string')));
    }

    function readStoredScoreboard(getStorage = () => window.localStorage) {
      const temporary = 'Neue Punkte bleiben nur in diesem geöffneten Fenster erhalten und gehen beim Neuladen verloren.';
      try {
        const raw = getStorage().getItem('mb14-scoreboard');
        if (raw === null || raw === '') return { entries: [], canWrite: true, notice: '' };
        let parsed;
        try { parsed = JSON.parse(raw); } catch { parsed = null; }
        if (!isStoredScoreboard(parsed)) return { entries: [], canWrite: false,
          notice: `Gespeicherte Punkte sind nicht lesbar und werden nicht überschrieben. ${temporary}` };
        return { entries: parsed, canWrite: true, notice: '' };
      } catch {
        return { entries: [], canWrite: true, notice: `Der Browser erlaubt keinen Zugriff auf gespeicherte Punkte. ${temporary}` };
      }
    }

    function writeStoredScoreboard(entries, getStorage = () => window.localStorage) {
      try {
        if (!isStoredScoreboard(entries)) return false;
        getStorage().setItem('mb14-scoreboard', JSON.stringify(entries));
        return true;
      } catch { return false; }
    }

    function physicalCardOrder(cards) {
      const ids = cards.map(card => card.id);
      return [...ids.filter(id => id % 2 === 1), ...ids.filter(id => id % 2 === 0)];
    }

    function parseCardList(text, maxCard) {
      const ids = new Set();
      const parts = String(text || '').split(/[,\s;]+/).filter(Boolean);
      if (!Number.isSafeInteger(maxCard) || maxCard < 0 || maxCard > 300 || parts.length > 600) { ids.error = 'Zu viele Bereiche oder ungültige Kartenzahl.'; return ids; }
      for (const part of parts) {
        const match = part.match(/^(\d+)(?:-(\d+))?$/);

        setLoadedGameCode(nextSet.code);
        setGameCodeInput(nextSet.code);

        setActiveCardManualInput('');

          setActiveCardMode('manual');

      function endRound() {
        if (roundStarted && !window.confirm('Runde beenden und Ziehungen verwerfen? Danach können Regeln und aktive Karten geändert werden. Punkte bleiben erhalten.')) return;
        resetRoundState();
        setError('Runde beendet. Regeln und aktive Karten können jetzt für eine neue Runde geändert werden.');
      }

      function loadPreset() {
        try {
          const preset = EZ_PRESETS.find(item => item.id === selectedPresetId);
          if (!preset) throw new Error('Diese Vorlage existiert nicht.');
          const prepared = createCardSet({ mode: preset.mode, params: preset.params, cardSeed: preset.cardSeed });
          if (!confirmSetReplacement(prepared)) return;
          applyPresetSettings(preset);
          commitCardSet(prepared);
        } catch (err) { setError(err.message || 'Vorlage konnte nicht geladen werden.'); }
      }

      function startNewRound({ replay = false } = {}) {
        try {
          if (!cards.length || !activeCardSet) throw new Error('Erzeuge oder lade zuerst ein Kartenset.');
          if (rulesError || selectionError) throw new Error(rulesError || selectionError);
          if (roundStarted && !window.confirm(replay ? 'Dieselbe Runde von vorn ziehen? Bisherige Ziehungen werden verworfen; bereits gewertete Karten bleiben gesperrt.' : 'Neue Runde beginnen? Ziehungen werden verworfen und alle Karten können erneut gewertet werden. Bisherige Punkte bleiben erhalten.')) return;
          const seed = replay ? activeRoundSeed : (roundSeedInput || '').trim() || makeSeed('R');
          const queue = buildDrawQueue({ mode: activeCardSet.mode, params: activeCardSet.params, roundSeed: seed });
          stopTimer();
          setTimerEnabled(false);
          setShowLastSolution(false);
          setActiveRoundSeed(seed);
          setRoundId(replay ? roundId : makeSeed('W'));
          setDrawQueue(queue);
          setHistory([]);
          setWinnerCard('');
          setWinnerName('');
          setRollKey(0);
          setRoundStarted(true);
          setLoadNotice('');
          setError('');
        } catch (err) { setError(err.message || 'Runde konnte nicht gestartet werden.'); }
      }

      function handleGenerateCards() {
        try {
          const nextSeed = (cardSeed || '').trim() || makeSeed('C');
          const prepared = createCardSet({ mode: gameMode, params, cardSeed: nextSeed });
          if (!confirmSetReplacement(prepared)) return;
          setCardSeed(nextSeed);
          commitCardSet(prepared);
        } catch (err) { setError(err.message || 'Fehler beim Erstellen der Bingo-Karten.'); }
      }

      function handleLoadGameCode() {
        try {
          const prepared = parseGameCode(gameCodeInput);
          if (!confirmSetReplacement(prepared)) return;
          applyParsedGame(prepared);
          setSelectedPresetId('');
          commitCardSet(prepared);
        } catch (err) { setError(err.message || 'Satzcode konnte nicht geladen werden.'); }
      }

      function saveSetFile() {
        let url;
        try {
          const text = serializeSetFile({ cardSet: activeCardSet, rules: bingoRules, threshold: Number(bingosToWin), activeCardIds });
          url = URL.createObjectURL(new Blob([text], { type: 'application/json;charset=utf-8' }));
          const link = document.createElement('a');
          link.href = url;
          link.download = `mathe-bingo_${activeCardSet.comparisonCode}.bingo.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setFileMessage('Satzdatei gespeichert. Zusammen mit den Karten digital weitergeben. Sie enthält die aktuell gewählten Regeln und aktiven Karten, keine Ziehungen oder Punkte.');
          setError('');
        } catch (err) { setError(err.message || 'Die Satzdatei konnte nicht gespeichert werden.'); }
        finally { if (url) setTimeout(() => URL.revokeObjectURL(url), 30000); }
      }

      async function readSetFile(event) {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;
        const request = ++fileRequestRef.current;
        setPendingSetFile(null);
        try {
          if (file.size > 32768) throw new Error('Die Satzdatei ist zu groß. Bitte die von dieser App gespeicherte .bingo.json-Datei wählen.');
          const prepared = parseSetFile(await file.text());
          if (request !== fileRequestRef.current) return;
          setPendingSetFile({ ...prepared, filename: file.name });
          setFileMessage('Datei geprüft. Angaben unten kontrollieren und dann übernehmen. Der bisherige Satz bleibt bis dahin geladen.');
          setError('');
        } catch (err) {
          if (request === fileRequestRef.current) setError(err.message || 'Die Satzdatei konnte nicht gelesen werden.');
        }
      }

      function acceptSetFile() {
        if (!pendingSetFile) return;
        applyParsedGame(pendingSetFile);
        commitCardSet(pendingSetFile);
      }

      async function copySetCode() {
        if (!activeCardSet) return;
        const request = ++copyRequestRef.current;
        try {
          await navigator.clipboard.writeText(activeCardSet.paperCode || activeCardSet.code);
          if (request === copyRequestRef.current) setCopyMessage(`Spielcode ${activeCardSet.paperCode || activeCardSet.code} kopiert.`);
        } catch {
          if (request === copyRequestRef.current) setCopyMessage('Kopieren nicht möglich. Den Code im Feld markieren und mit Strg+C kopieren. Der Satz bleibt geladen.');

      }

      function rollDice() {
        if (!roundStarted) {
          setError('Starte zuerst die Runde.');
          return;
        }
        if (!drawQueue.length) {
          setError('Alle möglichen Zielwerte dieser Runde wurden bereits gezogen. Setze die Runde zurück, um erneut zu starten.');
          setTimerEnabled(false);
          return;
        }
        const [next, ...rest] = drawQueue;
        if (!rest.length) setTimerEnabled(false);
        const stamped = { ...next, timestamp: new Date().toLocaleTimeString('de-DE') };
        setDrawQueue(rest);
        setHistory(prev => [stamped, ...prev]);
        setRollKey(k => k + 1);
        setError('');
      }
      rollDiceRef.current = rollDice;

      function getTimerMs() {
        const val = Number(timerValue);
        return timerUnit === 's' ? val * 1000 : val;
      }

      function startTimer() {
        stopTimer();
        const ms = getTimerMs();
        if (!Number.isFinite(ms) || ms < 100 || ms > 3600000) {
          setTimerEnabled(false);
          setError('Auto-Intervall: 100 bis 3600000 ms (0,1 bis 3600 s) eingeben. Auto ist aus.');
          return;
        }
        if (!canDraw) { setTimerEnabled(false); return; }
        setError(previous => previous.startsWith('Auto-Intervall:') ? '' : previous);
        setTimerCountdown(ms);
        let remaining = ms;
        countdownRef.current = setInterval(() => {
          remaining -= 100;
          setTimerCountdown(Math.max(0, remaining));
        }, 100);
        timerRef.current = setTimeout(() => {
          remaining = ms;
          setTimerCountdown(ms);
          rollDiceRef.current();
        }, ms);
      }

      function stopTimer() {
        clearTimeout(timerRef.current);
        clearInterval(countdownRef.current);
        timerRef.current = null;
        countdownRef.current = null;
        setTimerCountdown(null);
      }

      function addWinner() {
        if (!roundStarted || !winnerCheck.canAward) { setError(winnerCheck.message); return; }
        if (alreadyAwarded) { setError(`Karte #${winnerCheck.cardNo} wurde in dieser Runde bereits gewertet. Für eine Korrektur zuerst die Wertung zurücknehmen.`); return; }
        const name = winnerName.trim();
        if (!name) { setError('Nach der Papierkontrolle einen Namen für die Punkte eingeben.'); return; }
        const cardNo = winnerCheck.cardNo;
        const win = { card: cardNo, seed: activeRoundSeed, roundId, setCode: activeCardSet.setId, time: new Date().toLocaleTimeString('de-DE') };
        setScoreboard(prev => {
          if (prev.some(row => row.wins.some(w => w.roundId === roundId && w.card === cardNo))) return prev;
          const copy = [...prev];
          const idx = copy.findIndex(row => row.name.toLowerCase() === name.toLowerCase());
          if (idx >= 0) copy[idx] = { ...copy[idx], points: copy[idx].points + 1, wins: [...copy[idx].wins, win] };
          else copy.push({ name, points: 1, wins: [win] });
          return copy.sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));
        });
        setWinnerName('');
        setError('');
      }

      function retractWinner(name, index) {
        setScoreboard(prev => prev.map(row => {
          if (row.name !== name) return row;
          const wins = row.wins.filter((_, i) => i !== index);
          return { ...row, wins, points: wins.length };
        }).filter(row => row.points > 0).sort((a, b) => b.points - a.points || a.name.localeCompare(b.name)));
        setError('Wertung zurückgenommen. Nach erneuter Papierkontrolle kann sie korrigiert vergeben werden.');
      }

      // Embedded glyphs make pi/subscripts independent of PDF-viewer font substitution.
      function pdfMathWidth(doc, text) {
        let width = 0;
        for (const ch of String(text)) {
          doc.setFont('π₁₂'.includes(ch) ? 'MatheBingoMath' : 'helvetica', 'π₁₂'.includes(ch) ? 'normal' : 'bold');
          width += doc.getTextWidth(ch);
        }
        doc.setFont('helvetica', 'bold');
        return width;
      }

      function pdfMathText(doc, text, x, y, centered = false) {
        let tx = centered ? x - pdfMathWidth(doc, text) / 2 : x;
        for (const ch of String(text)) {
          doc.setFont('π₁₂'.includes(ch) ? 'MatheBingoMath' : 'helvetica', 'π₁₂'.includes(ch) ? 'normal' : 'bold');
          const glyph = ch;
          doc.text(glyph, tx, y);
          tx += doc.getTextWidth(glyph);
        }
        doc.setFont('helvetica', 'bold');
      }

      function drawFunctionGraphOnPdf(doc, entry, x, y, w, h) {
        const plotWidth = 520;
        const g = graphLayout(entry, plotWidth, 520, activeParams);
        const axes = graphAxisModel(entry, g);
        // Preserve square units when fitting the plot into rectangular PDF cells.
        const scale = Math.min(w / plotWidth, h / 520);
        const sx = v => x + (w - plotWidth * scale) / 2 + v * scale;
        const sy = v => y + (h - 520 * scale) / 2 + v * scale;
        doc.setLineWidth(0.08);doc.setDrawColor(226,232,240);
        g.xTicks.forEach(v => doc.line(sx(g.sx(v)),sy(g.top),sx(g.sx(v)),sy(g.bottom)));
        g.yTicks.forEach(v => doc.line(sx(g.left),sy(g.sy(v)),sx(g.right),sy(g.sy(v))));
        doc.setLineWidth(0.18);doc.setDrawColor(17,24,39);
        doc.line(sx(g.left),sy(g.sy(0)),sx(g.right),sy(g.sy(0)));
        doc.line(sx(g.sx(0)),sy(g.top),sx(g.sx(0)),sy(g.bottom));
        doc.setFont('helvetica','bold');doc.setTextColor(15,23,42);
        doc.setFontSize(14 * scale * 72 / 25.4);
        g.xTicks.forEach(v => doc.line(sx(g.sx(v)),sy(g.sy(0)-4),sx(g.sx(v)),sy(g.sy(0)+4)));
        g.yTicks.forEach(v => doc.line(sx(g.sx(0)-4),sy(g.sy(v)),sx(g.sx(0)+4),sy(g.sy(v))));
        axes.xLabels.forEach(([v,tx,ty]) => doc.text(String(v),sx(tx),sy(ty),{align:'center'}));
        axes.yLabels.forEach(([v,tx,ty]) => doc.text(String(v),sx(tx),sy(ty),{align:'right'}));
        doc.setFillColor(17,24,39);
        axes.arrows.forEach(([a,b,c]) => doc.triangle(sx(a[0]),sy(a[1]),sx(b[0]),sy(b[1]),sx(c[0]),sy(c[1]),'F'));
        doc.text('x',sx(axes.xName[0]),sy(axes.xName[1]),{align:'center'});doc.text('y',sx(axes.yName[0]),sy(axes.yName[1]),{align:'center'});
        doc.setFontSize(Math.min(6.5,w/12));
        doc.text(`Punkte: ${g.points.map(([px,py])=>`(${px}|${py})`).join('; ')}`,sx(plotWidth/2),sy(57),{align:'center'});
        doc.setDrawColor(79,70,229);doc.setFillColor(79,70,229);doc.setLineWidth(0.23);
        for(const segment of g.segments) for(let i=1;i<segment.length;i++) doc.line(sx(segment[i-1][0]),sy(segment[i-1][1]),sx(segment[i][0]),sy(segment[i][1]));
        const markerSize = 4 * scale;
        doc.setDrawColor(0,0,0);doc.setLineWidth(2 * scale);
        g.points.forEach(([px,py])=>{
          const cx = sx(g.sx(px)), cy = sy(g.sy(py));
          doc.line(cx-markerSize,cy-markerSize,cx+markerSize,cy+markerSize);
          doc.line(cx-markerSize,cy+markerSize,cx+markerSize,cy-markerSize);
        });
      }

      function drawGeometryFigureOnPdf(doc, entry, x, y, w, h) {
        const m = geometryFigureModel(entry);
        // Equal scale preserves circles, squares and angle markers in every cell.
        const scale = Math.min(w/520,h/360), ox=x+(w-520*scale)/2, oy=y+(h-360*scale)/2;
        const sx=v=>ox+v*scale, sy=v=>oy+v*scale;
        doc.setDrawColor(51,65,85);doc.setFillColor(238,246,255);doc.setLineWidth(0.25);
        for(const p of m.polygons) doc.lines(p.slice(1).map((q,i)=>[(q[0]-p[i][0])*scale,(q[1]-p[i][1])*scale]),sx(p[0][0]),sy(p[0][1]),[1,1],'FD',true);
        m.circles.forEach(([cx,cy,r])=>doc.circle(sx(cx),sy(cy),r*scale,'FD'));
        doc.setDrawColor(79,70,229);doc.setLineWidth(0.17);
        m.lines.forEach(([a,b])=>doc.line(sx(a[0]),sy(a[1]),sx(b[0]),sy(b[1])));
        doc.setFont('helvetica','bold');doc.setTextColor(15,23,42);
        m.texts.forEach(([tx,ty,text],i)=>{doc.setFontSize(Math.max(6, (i<2?18:23)*scale*72/25.4));doc.text(text,sx(tx),sy(ty),{align:'center'});});
      }

      function drawCardOnPdf(doc, card, pageSlot) {
        const pdfParams = activeCardSet?.params || params;
        const pdfMode = activeCardSet?.mode || gameMode;
        const pdfModeDef = GAME_MODES[pdfMode];
        const graphCard = card.entries.some(entry => entry.kind === 'graph' || entry.kind === 'geometryFigure');
        const functionGraphCard = card.entries.some(entry => entry.kind === 'graph');
        const compactCard = !graphCard && pdfParams.grid <= 3;
        const pageWidth = 210;
        const pageHeight = 297;
        const marginX = graphCard ? 5 : compactCard ? 6 : 10;
        const gapX = compactCard ? 5 : 0;
        const gapY = graphCard ? 4 : compactCard ? 5 : 8;
        const pageMarginY = graphCard ? 6 : compactCard ? 6 : 9;
        const slotHeight = functionGraphCard ? pageHeight - pageMarginY * 2 : (pageHeight - pageMarginY * 2 - gapY) / 2;
        const cardW = compactCard ? (pageWidth - marginX * 2 - gapX) / 2 : pageWidth - marginX * 2;
        const slotCol = compactCard ? Math.floor(pageSlot / 2) : 0;
        const slotRow = compactCard ? pageSlot % 2 : pageSlot;
        const cardX = marginX + slotCol * (cardW + gapX);
        const cardY = pageMarginY + slotRow * (slotHeight + gapY);
        doc.setFont('courier', 'normal');
        doc.setFontSize(6.5);
        const headerH = 19;
        const footerH = graphCard ? 3 : compactCard ? 5 : 7;
        const innerPad = graphCard ? 2 : compactCard ? 3 : 4;
        const gridW = cardW - innerPad * 2;
        const gridH = slotHeight - headerH - footerH - innerPad * 2;
        const cellW = gridW / pdfParams.grid;
        const cellH = gridH / pdfParams.grid;

        doc.setDrawColor(203, 213, 225);
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cardX, cardY, cardW, slotHeight, 4, 4, 'FD');
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(49, 46, 129);
        doc.setFontSize(graphCard ? 7.2 : compactCard ? 8.4 : 10.5);
        doc.text(`Mathe-Bingo #${card.id}`, cardX + 5, cardY + (graphCard ? 5.8 : 7));
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(51, 65, 85);
        doc.setFontSize(6.5);
        doc.text(`${pdfModeDef.label} | ${pdfParams.grid}x${pdfParams.grid} | ${pdfParams.cards} Karten`, cardX + 5, cardY + 10.5);

        const startX = cardX + innerPad;
        const startY = cardY + headerH + innerPad;
        for (let row = 0; row < pdfParams.grid; row++) {
          for (let col = 0; col < pdfParams.grid; col++) {
            const idx = row * pdfParams.grid + col;
            const entry = card.entries[idx];
            const x = startX + col * cellW;
            const y = startY + row * cellH;
            doc.setLineWidth(graphCard ? 0.12 : 0.2);
            doc.setDrawColor(203, 213, 225);
            doc.setFillColor(248, 250, 252);
            doc.rect(x, y, cellW, cellH, 'FD');
            doc.setTextColor(30, 41, 59);
            doc.setFont('helvetica', 'bold');
            const base = Math.min(compactCard ? 9.2 : 11.5, Math.max(compactCard ? 5.2 : 6.4, 12 - Math.max(0, String(entry.label).length - 8) * 0.18));
            doc.setFontSize(base);
            if (entry.kind === 'graph') {
              drawFunctionGraphOnPdf(doc, entry, x + 0.8, y + 0.8, cellW - 1.6, cellH - 1.6);
            } else if (entry.kind === 'geometryFigure') {
              drawGeometryFigureOnPdf(doc, entry, x + 1.2, y + 1.2, cellW - 2.4, cellH - 2.4);
            } else if (entry.kind === 'fraction' && entry.den !== 1) {
              const cx = x + cellW / 2;
              const cy = y + cellH / 2;
              const mixedParts = entry.mixed ? splitMixedFraction(entry.num, entry.den) : { whole: 0, num: entry.num, den: entry.den };
              const wholeText = mixedParts.whole ? String(mixedParts.whole) : '';
              if (wholeText && !mixedParts.num) {
                doc.text(wholeText, cx - doc.getTextWidth(wholeText) / 2, cy + base * 0.18);
                continue;
              }
              const num = String(mixedParts.num), den = String(mixedParts.den);
              const fracW = Math.max(doc.getTextWidth(num), doc.getTextWidth(den)) + 3;
              const wholeW = wholeText ? doc.getTextWidth(wholeText) + 2 : 0;
              const fracCx = cx + wholeW / 2;
              if (wholeText) doc.text(wholeText, cx - wholeW / 2 - doc.getTextWidth(wholeText) / 2, cy + base * 0.18);
              const lineW = Math.min(cellW * 0.34, Math.max(5, fracW));
              doc.line(fracCx - lineW / 2, cy, fracCx + lineW / 2, cy);
              doc.text(num, fracCx - doc.getTextWidth(num) / 2, cy - 1.3);
              doc.text(den, fracCx - doc.getTextWidth(den) / 2, cy + base * 0.45 + 1);
            } else {
              let size = base, lines, lineH;
              do {
                doc.setFontSize(size); lines = [''];
                for(const word of String(entry.label).split(/\s+/)) {
                  const i=lines.length-1, next=lines[i] ? `${lines[i]} ${word}` : word;
                  if(lines[i] && pdfMathWidth(doc,next)>cellW-3) lines.push(word); else lines[i]=next;
                }
                lineH = size*0.42+0.7;
                if(lines.length*lineH<=cellH-3 && lines.every(line=>pdfMathWidth(doc,line)<=cellW-3)) break;
                size -= 0.2;
              } while(size>=3.5);
              if(size<3.5) throw new Error('Diese Kartenantwort ist im gewählten Raster nicht lesbar. Bitte ein kleineres Raster wählen.');
              let textY = y+(cellH-(lines.length-1)*lineH)/2+size*0.16;
              lines.forEach(line=>{pdfMathText(doc,line,x+cellW/2,textY,true);textY+=lineH;});
            }
          }
        }
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(100, 116, 139);

        try {
          if (!cards.length || !activeCardSet) {

            return;
          }
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
          doc.addFileToVFS('MatheBingoMath.ttf', PDF_MATH_FONT);
          doc.addFont('MatheBingoMath.ttf', 'MatheBingoMath', 'normal');
          drawCoverOnPdf(doc);
          const pdfParams = activeCardSet?.params || params;
          const firstGraphCard = cards[0]?.entries.some(entry => entry.kind === 'graph' || entry.kind === 'geometryFigure');
          const firstFunctionGraphCard = cards[0]?.entries.some(entry => entry.kind === 'graph');
          const slotsPerPage = firstFunctionGraphCard ? 1 : !firstGraphCard && pdfParams.grid <= 3 ? 4 : 2;
          cards.forEach((card, index) => {
            if (index % slotsPerPage === 0) doc.addPage();
            drawCardOnPdf(doc, card, index % slotsPerPage);
          });
          doc.save(`mathe-bingo_1.4_Abgleich_${activeCardSet.comparisonCode}_${activeParams.grid}x${activeParams.grid}_${activeParams.cards}-karten.pdf`);

                            <div key={row.name} className="rounded-2xl bg-slate-50 px-4 py-3"><div className="flex justify-between gap-3"><b>{row.name}</b><b>{row.points}</b></div>

                            </div>
                          ))}
                        </div>
</div></details>);
      }

      const BingoHintBox = ({ fullscreenMode = false }) => (
        <div className={fullscreenMode ? 'fs-bingo-hint fs-pill rounded-2xl px-4 py-3 text-left text-sm' : 'rounded-3xl border border-emerald-100 bg-emerald-50 p-5 text-sm text-emerald-900'}>

            {winText && <div className={fullscreenMode ? 'font-black text-white' : 'font-black'}>{winText}</div>}

            {!fullscreenMode && <>

            </>}
          </div>
        </div>

      return (
        <>
          <div inert={fullscreen ? '' : undefined} className="s6-shell min-h-screen text-slate-800">

                <p className="text-sm font-semibold" data-testid="round-status">{roundStarted ? `${drawQueue.length ? 'Runde läuft' : 'Alle Zielwerte gezogen'} · ${history.length} gezogen · ${drawQueue.length} übrig${timerEnabled ? ' · Auto-Ziehen aktiv' : ''}` : 'Bereit · Runde noch nicht gestartet'}</p>

                <p><b>Aufbewahren:</b> Diese index.html funktioniert lokal ohne Internet einschließlich PDF. Freie Satzdateien zusätzlich zum PDF aufbewahren. Punkte liegen nur im Browser; bei einer Speichermeldung bleiben neue Punkte nur im geöffneten Fenster. Satzdateien sichern keine Punkte.</p>

                          <NumberInput label="Bingo-Raster" value={gridSizeInput} setValue={setGridSizeInput} min={2} max={gameMode === 'smartArithmetic' ? 5 : 8} />
                          <NumberInput label="Anzahl Karten" value={cardCountInput} setValue={setCardCountInput} min={1} max={300} />

                          {ModeSettings()}
                        </div>
</div></details>
                  {draftChanged && <p role="status" className="mt-4 rounded-xl bg-amber-50 p-3 text-sm text-amber-950">Entwurf geändert. Vorschau, PDF und Spiel gehören weiter zum geladenen Satz. Erst „Bingo-Karten erzeugen“ ersetzt ihn.</p>}
                  <div className="mt-4 flex flex-wrap gap-3"><button onClick={handleGenerateCards} className="s6-primary">Bingo-Karten erzeugen</button>{activeCardSet && <button onClick={() => { applyParsedGame(activeCardSet); setSelectedPresetId(''); }} className="s6-secondary">Entwurf verwerfen</button>}</div>
                </div>
                {activeCardSet && <section className="s6-panel mt-5" aria-label="Gespeicherte Kartenvorschau">
                  <div className="flex flex-wrap items-center justify-between gap-4"><div><h2 className="text-lg font-bold">2. Vorschau prüfen und PDF speichern</h2><p className="mt-1 text-sm">Geladener Satz · Abgleich {activeCardSet.comparisonCode}. PDF beginnt mit einem Deckblatt.</p></div><div className="flex flex-wrap gap-2"><button onClick={exportPdf} className="s6-primary">PDF exportieren</button><button onClick={playWithCurrentSet} className="s6-secondary">Mit diesem Satz spielen</button></div></div>
                  {!activeCardSet.paperCode && <div className="mt-4 rounded-xl bg-amber-50 p-3"><p className="text-sm">Freier Satz: Zum späteren Laden zusätzlich die Satzdatei speichern und digital mitgeben.</p><button onClick={saveSetFile} className="s6-secondary mt-2">Satzdatei speichern</button></div>}
                  <div className="mt-5 grid gap-5 md:grid-cols-2 xl:grid-cols-3">{cards.map(card => <BingoCard key={card.id} card={card} size={activeParams.grid} mode={activeMode} params={activeParams} />)}</div>
                </section>}
                {renderSetCodePanel()}

                        <div className="mt-4 grid grid-cols-2 gap-3 text-sm">
                          <div className="rounded-2xl bg-slate-50 p-4"><div className="text-slate-500">Aufgaben</div><b>{poolInfo.totalTasks}</b></div>
                          <div className="rounded-2xl bg-slate-50 p-4"><div className="text-slate-500">eindeutige Zielwerte</div><b>{poolInfo.uniqueTargets}</b></div>

                        </div>

                        {poolInfo.error && <div className="mt-4 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">{poolInfo.error}</div>}
                      </div>
                      <div className="rounded-3xl bg-white p-5 shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-900">Druckhinweise</h2>

                      </div>
</div></details>
              </>}

              {view === 'load' && <div className="s6-panel max-w-3xl">
                <h2 className="text-lg font-bold">Spielcode vom Deckblatt</h2><p className="mt-2 text-sm">Standardkarten: den kurzen Spielcode eingeben. Der achtstellige Kartenabgleich lädt keinen Satz.</p>
                        <form onSubmit={event => { event.preventDefault(); handleLoadGameCode(); }} className="mt-4 grid gap-3 md:grid-cols-[1fr_auto]">
                          <label><span className="mb-2 block text-sm font-bold text-indigo-900">Diesen Spielcode eingeben</span><input value={gameCodeInput} onChange={e => setGameCodeInput(e.target.value)} placeholder="Spielcode vom Deckblatt" aria-describedby="paper-code-help" autoComplete="off" autoCapitalize="characters" spellCheck={false} className="w-full rounded-xl border-2 border-indigo-300 px-4 py-3 font-mono text-lg tracking-wider outline-none focus:border-indigo-600" /></label>
                          <button type="submit" className="self-end rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white shadow-lg shadow-indigo-200">Spielcode laden</button>
                        </form>
                        <p id="paper-code-help" className="mt-2 text-xs text-slate-600">12 Zeichen, mit oder ohne Bindestriche. Groß-/Kleinschreibung ist egal. Vollständige MB3-Codes können ebenfalls eingefügt werden.</p>
                        <details className="mt-4 rounded-xl border border-slate-200 p-3"><summary className="cursor-pointer font-bold text-slate-700">Freien Satz aus Satzdatei laden</summary>

                          <label className="mt-3 block text-sm font-bold">Satzdatei auswählen<input type="file" accept=".json,application/json" onChange={readSetFile} className="mt-2 block w-full text-sm" /></label>

                        </details>


                {activeCardSet && <div className="mt-5 border-t border-slate-200 pt-4"><p className="text-sm font-semibold">Spielcode beziehungsweise Kartenabgleich oben mit dem Papier vergleichen. Danach mit genau diesem Satz weiterspielen.</p><button onClick={playWithCurrentSet} className="s6-primary mt-3">Mit diesem Satz spielen</button></div>}
                {renderSetCodePanel()}

              {view === 'play' && (!activeCardSet ? <div className="s6-panel"><h2 className="text-lg font-bold">Zuerst einen Kartensatz bereitstellen</h2><p className="mt-2 text-sm">Lade vorhandene Karten vom Deckblatt oder bereite neue Karten vor.</p><div className="mt-4 flex flex-wrap gap-3"><button onClick={() => setView('load')} className="s6-primary">Vorhandene Karten laden</button><button onClick={() => setView('prepare')} className="s6-secondary">Neue Karten erstellen</button></div></div> : <>
                <div className="s6-panel">
