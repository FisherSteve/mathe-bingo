                  <details ref={checkDetailsRef} className="s6-disclosure lg:col-span-2"><summary>Karte prüfen und Sieg bestätigen</summary>                      <div ref={cardCheckRef} className="rounded-3xl bg-white p-5 shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-900">Karte prüfen und Sieg bestätigen</h2>
                        <p className="mt-2 text-sm text-slate-600">Die App berechnet mögliche Treffer aus den Ziehungen. Papiermarkierungen und Lösungen kontrolliert die Lehrkraft vor der Wertung.</p>
                        <p className="mt-3 break-all text-sm"><b>{activeCardSet ? `Kartenabgleich (kein Ladecode): ${activeCardSet.comparisonCode}` : 'Noch kein Satz geladen'}</b> · mit der Papierkarte abgleichen. Eine Nummer allein erkennt keinen fremden Satz.</p>
                        <label className="mt-4 block font-bold">Kartennummer
                          <input value={winnerCard} onChange={e => setWinnerCard(e.target.value)} placeholder="Karte #" inputMode="numeric" className="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" />
                        </label>
                        <div role="status" data-testid="card-check-status" className={`mt-3 rounded-2xl px-4 py-3 text-sm font-semibold ${winnerCheck.canAward ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-800'}`}>{winnerCheck.message}</div>
                        {winnerCheck.card && <div className="mt-4" data-testid="checked-card">
                          <div className="mb-2 font-bold">Karte #{winnerCheck.cardNo} · {winnerCheck.count}/{bingosToWin} erfüllte Muster</div>
                          <div className="overflow-x-auto"><div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${activeParams.grid}, minmax(0, 1fr))`, maxWidth: winnerCheck.card?.entries.some(entry => ['graph','geometryFigure'].includes(entry.kind)) || activeParams.grid > 4 ? 'none' : activeParams.grid === 2 ? '20rem' : '28rem', minWidth: winnerCheck.card?.entries.some(entry => ['graph','geometryFigure'].includes(entry.kind)) ? `${activeParams.grid * 18}rem` : activeParams.grid > 4 ? `${activeParams.grid * 6}rem` : undefined }}>
                            {winnerCheck.card.entries.map((entry, index) => {
                              const inPattern = winnerCheck.patterns.some(pattern => pattern.indices.includes(index));
                              return <div key={index} data-marked={winnerCheck.marked[index]} data-pattern={inPattern} className={`bingo-cell rounded-xl border-2 p-2 text-center ${inPattern ? 'border-emerald-600 bg-emerald-100' : winnerCheck.marked[index] ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white'}`}>
                                {renderCardEntry(entry, activeMode, 'font-semibold break-words', activeParams)}
                                <span className="block text-xs font-bold">{inPattern ? '✓ Muster' : winnerCheck.marked[index] ? '✓ gezogen' : 'offen'}</span>
                              </div>;
                            })}
                          </div></div>
                          <p className="mt-2 text-sm">Erfüllte Muster: {winnerCheck.patterns.map(pattern => pattern.name).join(', ') || 'keine'}</p>
                        </div>}
                        <div className="mt-4 rounded-2xl bg-slate-50 p-4">
                          <p className="text-sm font-bold">Nach der Papierkontrolle</p>
                          {alreadyAwarded && <p className="mt-2 text-amber-800">Diese Karte wurde in dieser Runde bereits gewertet. Bei einem Fehler unter „Punkte und Wertungen korrigieren“ zurücknehmen.</p>}
                          <label className="mt-2 block text-sm">Name für den Punktestand<input value={winnerName} onChange={e => setWinnerName(e.target.value)} placeholder="Name" className="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3" /></label>
                          <button onClick={addWinner} disabled={!roundStarted || !winnerCheck.canAward || alreadyAwarded || !winnerName.trim()} className="mt-3 rounded-2xl bg-emerald-600 px-5 py-3 font-bold text-white disabled:opacity-40">Papier geprüft – Punkt vergeben</button>
                        </div>
                      </div>
</details>
                  <details className="s6-disclosure"><summary>Regeln und aktive Karten</summary><div className="p-2"><p className="p-3 text-sm">{roundStarted ? 'Für diese Runde fest gebunden. Zum Ändern unter Rundenaktionen die Runde beenden.' : 'Vor dem Start bei Bedarf an die ausgegebenen Karten anpassen.'}</p>                      <div className="rounded-3xl bg-white p-5 shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-900">Bingo-Regeln</h2>
                        <p className="mt-2 text-sm text-slate-600">Während der Runde bleiben Regeln und aktive Karten fest. Zum Ändern die Runde beenden. Bei 2×2 zählen vier Ecken und ganze Karte als zwei benannte Muster.</p>
                        {rulesError && <p role="alert" className="mt-2 text-rose-700">{rulesError}</p>}
                        <fieldset disabled={roundStarted} className="disabled:opacity-60">
                        <div className="mt-4 grid grid-cols-2 gap-3 text-sm font-semibold text-slate-600">
                          {[['rows','Zeilen'],['cols','Spalten'],['diags','Diagonalen'],['corners','vier Ecken'],['fullHouse','ganze Karte']].map(([key, label]) => <label key={key} className="flex items-center gap-2"><input type="checkbox" checked={bingoRules[key]} onChange={e => setBingoRules(r => ({ ...r, [key]: e.target.checked }))} className="h-5 w-5 accent-indigo-600" />{label}</label>)}
                        </div>
                        <label className="mt-4 block"><span className="mb-2 block text-sm font-semibold text-slate-600">Bingos für Sieg</span><input type="number" min="1" max="20" value={bingosToWin} onChange={e => setBingosToWin(e.target.value)} className="w-28 rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" /></label>
                        </fieldset>
                      </div>

                      <div className="rounded-3xl bg-white p-5 shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-900">Aktive Karten</h2>
                        {selectionError && <p role="alert" className="mt-2 text-rose-700">{selectionError}</p>}
                        <fieldset disabled={roundStarted} className="disabled:opacity-60">
                        <div className="mt-4 grid gap-3">
                          <select aria-label="Aktive Karten auswählen" value={activeCardMode} onChange={e => setActiveCardMode(e.target.value)} className="rounded-2xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500">
                            <option value="all">alle gedruckten Karten</option>
                            <option value="physical">erst ungerade, dann gerade</option>
                            <option value="manual">manuelle Kartenauswahl</option>
                          </select>
                          {activeCardMode === 'physical' && (
                            <div className="grid gap-3 sm:grid-cols-2">
                              <label><span className="mb-2 block text-sm font-semibold text-slate-600">Ausgeteilt</span><input type="number" min="1" max={cards.length || activeParams.cards} value={activeCardCount} onChange={e => setActiveCardCount(e.target.value)} className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" /></label>
                              <label><span className="mb-2 block text-sm font-semibold text-slate-600">Vorherige überspringen</span><input type="number" min="0" max={Math.max(0, cards.length || activeParams.cards)} value={activeCardOffset} onChange={e => setActiveCardOffset(e.target.value)} className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" /></label>
                              <button onClick={() => setActiveCardOffset(prev => clampNumber(Number(prev) - clampNumber(activeCardCount, 1, Math.max(1, cards.length), 10), 0, Math.max(0, cards.length), 0))} className="rounded-2xl bg-slate-100 px-4 py-3 text-sm font-bold text-slate-700">vorige Gruppe</button>
                              <button onClick={() => setActiveCardOffset(prev => clampNumber(Number(prev) + clampNumber(activeCardCount, 1, Math.max(1, cards.length), 10), 0, Math.max(0, cards.length), 0))} className="rounded-2xl bg-slate-100 px-4 py-3 text-sm font-bold text-slate-700">nächste Gruppe</button>
                            </div>
                          )}
                          {activeCardMode === 'manual' && <label><span className="mb-2 block text-sm font-semibold text-slate-600">Kartennummern</span><input value={activeCardManualInput} onChange={e => setActiveCardManualInput(e.target.value)} placeholder="1, 3, 5-11" className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" /></label>}
                          <div className="rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-600"><b>{activeCards.length}</b> aktiv: {summarizeCards(activeCardNumbers, Math.max(30, activeCardNumbers.length))}</div>
                        </div>
                        </fieldset>
                      </div>

</div></details>
                  <details className="s6-disclosure"><summary>Timer und Lösungen</summary><div className="p-4 space-y-4 text-sm">
                    <label className="flex items-center gap-2"><input type="checkbox" checked={timerEnabled} onChange={e => setTimerEnabled(e.target.checked)} disabled={!canDraw} className="h-5 w-5" />Auto-Ziehen</label>
                    <div className="flex flex-wrap gap-3"><label>Auto-Intervall<input aria-label="Auto-Intervall" type="number" min={timerUnit === 's' ? 0.1 : 100} max={timerUnit === 's' ? 3600 : 3600000} step="any" value={timerValue} onChange={e => setTimerValue(e.target.value)} className="s6-input mt-1 w-28" /></label><label>Zeiteinheit<select aria-label="Zeiteinheit" value={timerUnit} onChange={e => setTimerUnit(e.target.value)} className="s6-input mt-1"><option value="s">s</option><option value="ms">ms</option></select></label></div>
                    {timerEnabled && timerCountdown !== null && <div><p>Nächste Ziehung in {timerUnit === 's' ? `${(timerCountdown / 1000).toFixed(1)} s` : `${timerCountdown} ms`}</p><div className="mt-2 h-2 rounded-full bg-slate-200 overflow-hidden"><div className="h-full bg-emerald-600" style={{ width: `${(timerCountdown / getTimerMs()) * 100}%` }} /></div></div>}
                    <label className="flex items-center gap-2"><input type="checkbox" checked={showLastSolution} onChange={e => setShowLastSolution(e.target.checked)} className="h-5 w-5" />{activeMode === 'smartArithmetic' ? 'Vorherige Lösungen und Rechenweg anzeigen' : 'Vorherige Lösungen anzeigen'}</label><p>Freigegeben wird ausschließlich die vorherige Aufgabe. Die aktuelle Aufgabe bleibt ohne Ergebnis.</p>
                  </div></details>
                  <details className="s6-disclosure"><summary>Rechnerische Bingo-Kandidaten ({bingoState.bingoRows.length})</summary><div className="p-2">{BingoHintBox({})}</div></details>
                  {renderPoints()}
                  <details className="s6-disclosure"><summary>Letzte Ziehungen</summary>                      <div className="rounded-3xl bg-white p-5 shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-900">Letzte Ziehungen</h2>
                        <div className="mt-4 space-y-2 max-h-[18rem] overflow-auto pr-1">
                          {history.length === 0 ? <div className="rounded-2xl bg-slate-50 p-4 text-slate-500">Noch keine Ziehungen.</div> : history.map((entry, idx) => (
                            <div key={`${entry.id}-${idx}`} className="flex items-center justify-between rounded-2xl bg-slate-50 px-4 py-3 gap-3">
                              <div className="font-semibold text-slate-700 break-words">{activeModeDef.renderTask(entry, activeParams)} {showLastSolution && idx > 0 && <span className="ml-2 text-xs font-black text-emerald-700">→ {getSolutionLabel(entry, activeMode)}</span>}</div>
                              <div className="text-xs text-slate-400 whitespace-nowrap">{entry.timestamp}</div>
                            </div>
                          ))}
                        </div>
                      </div>
</details>
                  <details className="s6-disclosure"><summary>Rundenaktionen</summary><div className="p-4 space-y-3 text-sm">
                    {roundStarted && <><p>Neustart behält Wertungssperren. Eine neue Runde erlaubt eine neue Wertung.</p><div className="flex flex-wrap gap-2"><button onClick={() => startNewRound({ replay: true })} className="s6-secondary">Neustart (gleiche Runde)</button><button onClick={() => startNewRound()} disabled={!canStartRound} className="s6-secondary">Neue Runde (neue Wertung)</button><button onClick={endRound} className="s6-secondary">Runde beenden / Regeln ändern</button></div></>}
                    <details><summary className="font-bold cursor-pointer">Erweiterte Rundenoptionen</summary><label className="block mt-3">Runden-Seed optional<input value={roundSeedInput} onChange={e => setRoundSeedInput(e.target.value)} placeholder="automatisch" className="s6-input mt-2" /></label><p className="mt-2">Bestimmt nur die Ziehungsreihenfolge der nächsten Runde. Aktiver Rundenseed: {activeRoundSeed || 'noch keiner'}. Satzcodes enthalten keine Ziehungen oder Punkte.</p></details>
                  </div></details>
                </div>
                {renderSetCodePanel()}
              </>)}
              {view === 'play' && !activeCardSet && <div className="mt-4">{renderPoints()}</div>}
            </main>
          </div>
          {fullscreen && (
            <div ref={presentationRef} role="dialog" aria-modal="true" aria-label="Präsentation" className={`fs-overlay no-print ${currentDraw?.kind === 'graph' ? 'fs-overlay-graph' : ''}`} onKeyDown={handlePresentationKeys}>
              <div className="fs-topbar">
                <div className="fs-pill rounded-2xl px-3 py-2 flex flex-wrap items-center gap-2">
                  <label className="flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" checked={timerEnabled} onChange={e => setTimerEnabled(e.target.checked)} disabled={!canDraw} className="w-5 h-5 accent-emerald-400" /><span className="font-semibold">Auto</span></label>
                  <input aria-label="Auto-Intervall" type="number" min={timerUnit === 's' ? 0.1 : 100} max={timerUnit === 's' ? 3600 : 3600000} step="any" value={timerValue} onChange={e => setTimerValue(e.target.value)} className="w-16 rounded-xl bg-white/10 border border-white/30 px-2 py-1 text-center outline-none" />
                  <select aria-label="Zeiteinheit" value={timerUnit} onChange={e => setTimerUnit(e.target.value)} className="rounded-xl bg-white/10 border border-white/30 px-2 py-1 outline-none"><option value="s" className="text-black">s</option><option value="ms" className="text-black">ms</option></select>
                  <label className="flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" checked={showLastSolution} onChange={e => setShowLastSolution(e.target.checked)} className="w-5 h-5 accent-indigo-300" /><span className="font-semibold">Vorherige Lösungen</span></label>
                  <span className="text-white/75 text-sm">Rest {roundStarted ? drawQueue.length : '-'}</span>
                  {error && <span role="alert" className="text-amber-200">{error}</span>}
                </div>
                <div className="flex flex-wrap gap-2"><button onClick={() => { setFullscreen(false); openCardCheck(); }} className="fs-pill rounded-2xl px-4 py-3 font-bold">Karte prüfen</button><button data-presentation-close onClick={() => setFullscreen(false)} className="fs-pill rounded-2xl px-5 py-3 font-bold">Beenden</button></div>
              </div>
              <div className={`fs-main ${activeModeDef.usesDice && roundStarted ? '' : 'fs-main-no-dice'}`}>
                {activeModeDef.usesDice && roundStarted && (
                  <div className="fs-dice-grid">
                    <div key={`fs-a-${rollKey}`} className="fs-dice-face animate-dice-pop flex items-center justify-center text-center text-[clamp(2rem,8vw,5.5rem)] font-black">{currentDraw ? (currentDraw.subtype === 'expand' ? currentDraw.num : currentDraw.displayNum ?? currentDraw.a ?? currentDraw.num ?? '') : ''}</div>
                    <div className="text-[clamp(2rem,7vw,5rem)] font-black text-white/45">{activeMode === 'fractions' ? '/' : '·'}</div>
                    <div key={`fs-b-${rollKey}`} className="fs-dice-face animate-dice-pop flex items-center justify-center text-center text-[clamp(2rem,8vw,5.5rem)] font-black">{currentDraw ? (currentDraw.subtype === 'expand' ? currentDraw.den : currentDraw.displayDen ?? currentDraw.b ?? currentDraw.den ?? '') : ''}</div>
                  </div>
                )}
                <div className="fs-task">
                  <div className="text-white/70 text-sm md:text-base font-bold uppercase tracking-[0.22em]">{currentDraw ? activeModeDef.taskName : roundStarted ? 'Bereit?' : 'Runde nicht gestartet'}</div>
                  <div key={`fs-task-${rollKey}`} className={`fs-task-text mt-4 font-black animate-result-flip ${activeModeDef.usesDice ? '' : 'task-expression'}`}>{currentDraw ? activeModeDef.renderTask(currentDraw, activeParams) : roundStarted ? 'Erste Ziehung' : 'Runde starten'}</div>
                  {showLastSolution && previousDraw && <div className="mt-4 inline-flex max-w-full rounded-2xl bg-white/15 px-5 py-3 text-[clamp(1.1rem,3vw,2rem)] font-black text-white">Lösung vorherige Aufgabe: {previousSolution}</div>}
                  {showLastSolution && previousDraw && activeMode === 'smartArithmetic' && <div data-testid="previous-strategy" data-task-id={previousDraw.id} className="mx-auto mt-3 max-w-5xl text-[clamp(0.9rem,1.6vw,1.6rem)] font-semibold leading-relaxed">Ein möglicher Rechenweg: {previousDraw.strategy}</div>}
                </div>
              </div>
              <div className="fs-bottombar">
                <div className="min-w-0 flex flex-1 items-end gap-3">
                  <span className="text-sm">{history.length} gezogen · {bingoState.winRows.length} rechnerisch siegfähige Karten</span>
                  {timerEnabled && timerCountdown !== null && <><div className="mb-2 text-sm text-white/75">Nächste Ziehung in {timerUnit === 's' ? `${(timerCountdown / 1000).toFixed(1)}s` : `${timerCountdown}ms`}</div><div className="h-2 max-w-xl rounded-full bg-white/20 overflow-hidden"><div className="h-full rounded-full bg-emerald-400 transition-all" style={{ width: `${(timerCountdown / getTimerMs()) * 100}%` }} /></div></>}
                </div>
                {!timerEnabled && !roundStarted && <button onClick={() => startNewRound()} disabled={!canStartRound} className={`fs-button rounded-2xl px-8 py-4 text-2xl font-black transition ${!canStartRound ? 'opacity-50 cursor-not-allowed bg-slate-500' : 'hover:scale-[1.02]'}`}>Runde starten</button>}
                {!timerEnabled && roundStarted && <button onClick={rollDice} disabled={!canDraw || timerEnabled} className={`fs-button rounded-2xl px-8 py-4 text-2xl font-black transition ${!canDraw ? 'opacity-50 cursor-not-allowed bg-slate-500' : 'hover:scale-[1.02]'}`}>Ziehen</button>}
              </div>
            </div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
